<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Exam Practice</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f11;
    --surface: #18181c;
    --surface2: #222228;
    --border: #2e2e38;
    --accent: #6ee7b7;
    --accent2: #818cf8;
    --danger: #f87171;
    --warning: #fbbf24;
    --text: #e8e8f0;
    --muted: #8888a8;
    --correct: #6ee7b7;
    --wrong: #f87171;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* LANDING */
  #landing {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 24px;
    text-align: center;
  }

  .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 20px;
    opacity: 0.8;
  }

  h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 12px;
    background: linear-gradient(135deg, var(--text) 0%, var(--muted) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 48px;
  }

  .exam-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    width: 100%;
    max-width: 800px;
    margin-bottom: 32px;
  }

  .exam-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    position: relative;
    overflow: hidden;
  }

  .exam-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.2s ease;
  }

  .exam-card:hover {
    border-color: var(--accent);
    background: var(--surface2);
    transform: translateY(-2px);
  }

  .exam-card:hover::before { transform: scaleX(1); }

  .exam-card.selected {
    border-color: var(--accent);
    background: var(--surface2);
  }

  .exam-card.selected::before { transform: scaleX(1); }

  .card-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .card-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
  }

  .card-meta {
    font-size: 12px;
    color: var(--muted);
  }

  .check-mark {
    position: absolute;
    top: 12px; right: 12px;
    width: 18px; height: 18px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    color: var(--bg);
    opacity: 0;
    transition: opacity 0.15s;
  }

  .exam-card.selected .check-mark { opacity: 1; }

  .all-btn {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 32px;
  }

  .btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 10px 22px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--bg);
  }

  .btn-primary:hover { background: #a7f3d0; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover { border-color: var(--muted); color: var(--text); }

  /* QUIZ */
  #quiz { display: none; }

  .quiz-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .quiz-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .quiz-progress-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .progress-bar-wrap {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 4px;
  }

  .progress-bar-inner {
    height: 4px;
    background: var(--accent);
    transition: width 0.3s ease;
    border-radius: 0 2px 2px 0;
  }

  .quiz-body {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  .question-block {
    display: none;
    animation: fadeUp 0.2s ease;
  }

  .question-block.active { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .question-source {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .question-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--accent2);
    margin-bottom: 12px;
  }

  .question-text {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
    margin-bottom: 28px;
  }

  .question-text code, .question-text .math-inline {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    background: var(--surface2);
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--accent);
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0 24px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }

  .data-table th {
    background: var(--surface2);
    color: var(--accent);
    padding: 8px 12px;
    text-align: left;
    border: 1px solid var(--border);
    font-weight: 500;
  }

  .data-table td {
    padding: 6px 12px;
    border: 1px solid var(--border);
    color: var(--text);
  }

  .data-table tr:nth-child(even) td { background: var(--surface); }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.12s ease;
    user-select: none;
  }

  .option:hover:not(.locked) {
    border-color: var(--accent2);
    background: var(--surface2);
  }

  .option.selected:not(.locked) {
    border-color: var(--accent2);
    background: var(--surface2);
  }

  .option.correct {
    border-color: var(--correct);
    background: rgba(110, 231, 183, 0.07);
  }

  .option.wrong {
    border-color: var(--wrong);
    background: rgba(248, 113, 113, 0.07);
  }

  .option-letter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    min-width: 18px;
    padding-top: 1px;
    transition: color 0.12s;
  }

  .option.selected .option-letter { color: var(--accent2); }
  .option.correct .option-letter { color: var(--correct); }
  .option.wrong .option-letter { color: var(--wrong); }

  .option-text {
    font-size: 14px;
    line-height: 1.55;
    color: var(--text);
  }

  .option.correct .option-text { color: var(--correct); }
  .option.wrong .option-text { color: var(--wrong); }

  .feedback {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }

  .feedback.correct {
    background: rgba(110, 231, 183, 0.08);
    border: 1px solid rgba(110, 231, 183, 0.3);
    color: var(--correct);
    display: block;
  }

  .feedback.wrong {
    background: rgba(248, 113, 113, 0.08);
    border: 1px solid rgba(248, 113, 113, 0.3);
    color: #fca5a5;
    display: block;
  }

  .nav-row {
    display: flex;
    gap: 10px;
    margin-top: 28px;
    align-items: center;
  }

  .btn-check {
    background: var(--accent2);
    color: white;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 10px 20px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.06em;
  }

  .btn-check:hover { background: #a5b4fc; }
  .btn-check:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn-next {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.06em;
  }

  .btn-next:hover { border-color: var(--accent); color: var(--accent); }

  .skip-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.06em;
  }

  .skip-btn:hover { color: var(--text); }

  /* RESULTS */
  #results { display: none; }

  .results-wrap {
    max-width: 600px;
    margin: 0 auto;
    padding: 60px 24px;
    text-align: center;
  }

  .score-ring {
    width: 140px;
    height: 140px;
    margin: 0 auto 32px;
    position: relative;
  }

  .score-ring svg { transform: rotate(-90deg); }

  .score-num {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 28px;
    font-weight: 600;
    color: var(--text);
  }

  .score-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .result-grade {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 32px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .result-grade.pass { color: var(--correct); }
  .result-grade.borderline { color: var(--warning); }
  .result-grade.fail { color: var(--wrong); }

  .result-detail {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 40px;
  }

  .breakdown {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 28px;
    text-align: left;
  }

  .breakdown-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .brow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .brow:last-child { border-bottom: none; }
  .brow-name { color: var(--muted); }
  .brow-score { font-family: 'IBM Plex Mono', monospace; color: var(--text); font-size: 12px; }

  .result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* Inline note blocks */
  .note-block {
    background: var(--surface2);
    border-left: 3px solid var(--accent);
    padding: 10px 14px;
    border-radius: 0 6px 6px 0;
    font-size: 13px;
    color: var(--muted);
    margin: 12px 0 20px;
    font-style: italic;
  }

  .formula-block {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    margin: 12px 0 20px;
    color: var(--accent);
    overflow-x: auto;
    line-height: 1.8;
  }
</style>
</head>
<body>

<!-- LANDING -->
<div id="landing">
  <div class="logo">VU Amsterdam · Machine Learning</div>
  <h1>Practice Exams</h1>
  <p class="subtitle">Select exams to include, then start your quiz</p>

  <div class="exam-grid" id="examGrid"></div>

  <div class="all-btn">
    <button class="btn btn-secondary" onclick="selectAll()">Select all</button>
    <button class="btn btn-secondary" onclick="selectNone()">Clear</button>
  </div>

  <button class="btn btn-primary" id="startBtn" onclick="startQuiz()" disabled>Start quiz →</button>
</div>

<!-- QUIZ -->
<div id="quiz">
  <div class="quiz-header">
    <div class="quiz-title" id="quizTitle">ML Practice</div>
    <div class="quiz-progress-text" id="progressText">0 / 0</div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-inner" id="progressBar" style="width:0%"></div>
  </div>
  <div class="quiz-body" id="quizBody"></div>
</div>

<!-- RESULTS -->
<div id="results">
  <div class="results-wrap">
    <div class="score-label">Your score</div>
    <div class="score-ring">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx="70" cy="70" r="60" fill="none" stroke="#2e2e38" stroke-width="10"/>
        <circle cx="70" cy="70" r="60" fill="none" stroke="#6ee7b7" stroke-width="10"
          stroke-dasharray="376.99" stroke-dashoffset="376.99" id="scoreCircle"
          stroke-linecap="round"/>
      </svg>
      <div class="score-num" id="scoreNum">0%</div>
    </div>

    <div class="result-grade" id="resultGrade">—</div>
    <div class="result-detail" id="resultDetail"></div>

    <div class="breakdown" id="breakdown"></div>

    <div class="result-actions">
      <button class="btn btn-primary" onclick="restartSame()">Retry same questions</button>
      <button class="btn btn-secondary" onclick="goHome()">Back to exams</button>
    </div>
  </div>
</div>

<script>
// =====================
// EXAM DATA
// =====================

const EXAMS = [
  {
    id: 'prac2020',
    tag: 'Practice',
    title: 'Practice Exam B',
    date: 'Feb 2020',
    questions: [
      {q: "Which answer contains only unsupervised methods and tasks?", opts: ["Clustering, Linear regression, Generative modeling","k-Means, Clustering, Density estimation","Classification, Clustering, Expectation-Maximization","Logistic regression, Density estimation, Clustering"], ans: 1},
      {q: "The two most important conceptual spaces in machine learning are the model space and the feature space. Which is true?", opts: ["Every point in the model space represents a loss function that we can choose for our task.","Every point in the model space represents a single instance in the dataset.","Every point in the feature space represents a single feature of a single instance in the dataset.","Every point in the feature space represents a single instance in the dataset."], ans: 3},
      {q: "The ALVINN system from 1995 was a self-driving car system implemented as a classifier: a grayscale camera was pointed at the road and a classifier was trained to predict the correct position of the steering wheel based on the behavior of a human driver. In this example, which are the instances and which are the features?", opts: ["The instances are the different cars the system is deployed in and the features are the angles of the steering wheel.","The instances are the angles of the steering wheel and the features are the different cars the system is deployed in.","The instances are the frames produced by the camera and the features are the pixel values.","The instances are the pixel values and the features are the frames produced by the camera."], ans: 2},
      {q: "What is the relation between the loss landscape and its gradient?", opts: ["The gradient points in the direction that the loss increases the fastest.","The gradient points in the direction that the loss decreases the fastest.","The gradient is the region of the loss landscape where the loss is the lowest.","The gradient is the region of the loss landscape where the loss is the highest."], ans: 0},
      {q: "Which is a legitimate reason to prefer random search over gradient descent as a search method?", opts: ["The loss surface is complicated, so I want the size of the steps to change as I approach a minimum.","I need to be sure that I've found a global minimum.","My model has multiple layers, so I want to use backpropagation.","My model is not differentiable."], ans: 3},
      {q: "What is the benefit of a convex loss surface?", opts: ["It allows us to use the backpropagation algorithm.","It allows us to use evolutionary methods.","It ensures that there are no local minima other than the global minimum.","It allows gradient descent to escape local maxima."], ans: 2},
      {q: "Rob trains a k-nearest neighbors classifier. He withholds 20% of his data as a test set and uses the rest as his training data. He runs the training algorithm twenty times, for k = 1 to k = 20. For each, he computes the accuracy on the test set. He gets the best accuracy for k = 17, so he reports this accuracy as an estimate of the performance of k-nearest neighbors on his data. What fundamental mistake has Rob made?", opts: ["Rob is checking a linear range of values for hyperparameter k when a logarithmic range would be better.","He is using arbitrary values for k. He should use a grid search.","The test set should always be bigger than the training set.","By reusing his test set, he may be inflating his performance estimate and overfitting to an arbitrary value of k."], ans: 3},
      {q: "Accuracy is a very simple and effective performance metric, but in certain cases, we should be careful. Imagine a spam classifier that automatically deletes emails detected as spam. The user receives about one spam email for every legitimate email. Why should we be careful optimizing for accuracy?", opts: ["Because we have very high class imbalance.","Because we have very high cost imbalance.","Because the data arrives irregularly.","Because this is an online learning problem."], ans: 1},
      {q: "Maria is fitting a regression model to predict the year in which a particular piece of instrumental music was written. The prediction is based on various features like average and variance of loudness, rhythm, key etc. She realizes that she has many outliers: for instance, the atonal music of the 1920s produces extreme variations in loudness, and John Cage's piece 4'33\" from 1952 is entirely silent. What should she do?", opts: ["She should remove these instances entirely. Removing outliers will make it easier to fit the data with a normal distribution.","She should remove these instances from the training data, but leave them in the test data.","She should leave these instances in the training data, but remove them from the test data.","She should leave these instances in. They are important examples of the data distribution."], ans: 3},
      {q: "When we want to model the throwing of a single die, using probability theory, we define a sample space and an event space. Which is true?", opts: ['"Rolling an even number" is an element of the event space. "Rolling a 1" is an element of the sample space.','"Rolling an even number" is an element of the sample space. "Rolling a 1" is an element of the event space.',"For this example, the event space is continuous, the sample space is discrete.","For this example, the sample space is continuous, the event space is discrete."], ans: 0},
      {q: "Let f(x) = σ(wx + b) be a logistic regression model. We interpret f(x) as the probability that x has the positive class. If x actually has the negative class, what is the cross-entropy loss for this single example?", opts: ["− log f(x)","− log(1 − f(x))","− log f(x) − log(1 − f(x))","log f(x) − log(1 − f(x))"], ans: 1},
      {q: "Frank is a researcher in the 1960s. He's just read about a new model called the perceptron, which is a highly simplified simulation of a single brain cell. Frank decides that if a brain is powerful because it chains together multiple brain cells, he should try to chain together multiple perceptrons, to make a network that is more powerful than a single perceptron. Why won't chaining perceptrons together work in this way?", opts: ["A GPU is needed to compute the output of such a function.","The perceptron is a linear function, and the composition of linear functions is still a linear function.","Such a model would suffer from vanishing gradients.","This is equivalent to hypothesis boosting, which has been proven to be impossible."], ans: 1},
      {q: "In a support vector machine, what are the support vectors?", opts: ["The parameters wᵀ that are multiplied by the input x to produce a classification.","The parameters b that are added to the input x to produce a classification.","The positive and negative data points that are allowed to fall inside the margin.","The positive and negative data points that are closest to the decision boundary."], ans: 3},
      {q: "In deep learning, what is the difference between lazy and eager execution (or evaluation)?", opts: ["In lazy execution, the computation graph is compiled and kept static during training. In eager execution, it is built up for each forward pass.","In eager execution, the computation graph is compiled and kept static during training. In lazy execution, it is built up for each forward pass.","In lazy execution, the gradient is computed by numeric approximation, while eager execution uses the backpropagation algorithm.","In eager execution, the gradient is computed by numeric approximation, while lazy execution uses the backpropagation algorithm."], ans: 0},
      {q: "Why is the ReLU activation function often preferred over the sigmoid activation function, for hidden nodes?", opts: ["It causes more vanishing gradients, which help learning.","The sigmoid function cannot be used with gradient descent.","Its derivative is almost always either 0 or 1, reducing vanishing gradients.","The sigmoid function contains a point where the gradient is not defined."], ans: 2},
      {q: "When we apply the chain rule to a complex operation involving tensors, the local derivatives might be something like the derivative of a vector with respect to a matrix — a 3-tensor, complex to work out and expensive to store. How do modern ML frameworks avoid this problem in their implementation of backpropagation?", opts: ["They approximate the local derivative using random search.","They approximate the local derivative using the EM algorithm.","They don't compute the local derivative, but the product of the upstream derivative (the loss over the module outputs) with the local derivative.","They don't compute the local derivative, but the product of the downstream derivative (the module inputs over the network inputs) with the local derivative."], ans: 2},
      {q: "How is the log-likelihood like a loss function?", opts: ["The log-likelihood is an approximation of the loss function.","The loss function is an approximation of the log-likelihood.","When we train a model, we minimize the loss, and when we fit a distribution, we often minimize the log-likelihood.","When we train a model, we minimize the loss, and when we fit a distribution, we often maximize the log-likelihood."], ans: 3},
      {q: "If we train a generator network by comparing a random output to a random target example from the data and backpropagating the difference, we get mode collapse. The problem is that we don't know which random input corresponds to which item in the dataset. How do GANs solve this problem?", opts: ["By training a second network to map the target example to a distribution on the input space.","By adding a KL-loss term on the random inputs of the generator network.","By training the generator to generate outputs that a second network recognizes as real, and training the second network to distinguish generated outputs from real data.","By adding a cycle-consistency loss-term."], ans: 2},
      {q: "Sometimes we want to learn a model that maps some input to some output, but in some aspects we also want the model to behave like a generator. For instance, if we train a model to colorize photographs, we don't want it to be purely deterministic. Which GAN approach is designed to accomplish this?", opts: ["Vanilla GAN","Conditional GAN","CycleGAN","StyleGAN"], ans: 1},
      {q: "The Variational Autoencoder (VAE) differs from a regular autoencoder in several aspects. Which is NOT one of them?", opts: ["It includes a discriminator, which tries to tell the difference between data points and samples from the generator.","It has an added loss term that ensures that the data looks like a standard normal distribution in the latent space.","For a given instance, the encoder produces a distribution on the latent space, instead of a single point.","It includes a sampling step in the middle, where a latent vector is sampled from the distribution provided by the encoder."], ans: 0},

      {q: 'The most important rule in machine learning is "never judge your performance on the training data." If we break this rule, what can happen?', opts: ["The loss surface no longer provides an informative gradient.","We get cost imbalance.","We end up choosing a model that overfits the training data.","We commit multiple testing."], ans: 2},

      {q: 'In the slides, we get the advice that "sometimes your loss function should not be the same as your evaluation function." Why not?', opts: ["The evaluation function may provide a smooth loss surface.","The loss surface resulting from the evaluation function may have a shape that makes searching for the minimum difficult.","The evaluation function may not be linear, and a loss function must be linear.","The evaluation function may not be a polynomial, and the loss function must be a polynomial."], ans: 1},

      {q: "What is the Markov assumption? Does the LSTM make the Markov assumption?", opts: ["That the probability of a word depends only on a fixed number of words before it. The LSTM makes a Markov assumption.","That the probability of a word depends only on a fixed number of words before it. The LSTM does not make a Markov assumption.","That it is more likely that a word should be forgotten than that it should be remembered. The LSTM makes a Markov assumption.","That it is more likely that a word should be forgotten than that it should be remembered. The LSTM does not make a Markov assumption."], ans: 1},

      {q: "What is mode collapse?", opts: ["When the loss surface of a generator network flattens out, so the gradient becomes zero.","When a network has a sampling step in the middle, so we cannot backpropagate down to the input.","When the distribution in the latent space is similar to a hypersphere.","When a generator network outputs the mean of the data, instead of providing different samples with variation."], ans: 3},

      {q: "The mean is sensitive to outliers. What does this mean, and why is it the case?", opts: ["One instance can affect the mean much more than others if its value is unusually large. This happens because the mean minimizes the absolute magnitude of the distances.","One instance can affect the mean much more than others if its value is unusually large. This happens because the mean minimizes the squares of the distances.","It means it can be a poor representation of the data if all instances are far from the average. This happens because the mean minimizes the absolute magnitude of the distances.","It means it can be a poor representation of the data if all instances are far from the average. This happens because the mean minimizes the squares of the distances."], ans: 1},

      {q: "The two most important conceptual spaces in machine learning are the model space and the feature space. Which is true?", opts: ["Every point in the model space represents a loss function that we can choose for our task.","Every point in the model space represents a single instance in the dataset.","Every point in the feature space represents a single feature of a single instance in the dataset.","Every point in the feature space represents a single instance in the dataset."], ans: 3},
      {q: "The ALVINN system from 1995 was a self-driving car system: a grayscale camera was pointed at the road and a classifier was trained to predict the steering wheel position based on a human driver. Which are the instances and which are the features?", opts: ["The instances are the different cars the system is deployed in and the features are the angles of the steering wheel.","The instances are the angles of the steering wheel and the features are the different cars the system is deployed in.","The instances are the frames produced by the camera and the features are the pixel values.","The instances are the pixel values and the features are the frames produced by the camera."], ans: 2},
      {q: "What is the relation between the loss landscape and its gradient?", opts: ["The gradient points in the direction that the loss increases the fastest.","The gradient points in the direction that the loss decreases the fastest.","The gradient is the region of the loss landscape where the loss is the lowest.","The gradient is the region of the loss landscape where the loss is the highest."], ans: 0},

      {q: "Accuracy is very simple and effective, but in certain cases we should be careful. Imagine a spam classifier that automatically deletes emails detected as spam. The user receives about one spam email for every legitimate email. Why should we be careful optimizing for accuracy?", opts: ["Because we have very high class imbalance.","Because we have very high cost imbalance.","Because the data arrives irregularly.","Because this is an online learning problem."], ans: 1},

      {q: "In deep learning, what is the difference between lazy and eager execution?", opts: ["In lazy execution, the computation graph is compiled and kept static during training. In eager execution, it is built up for each forward pass.","In eager execution, the computation graph is compiled and kept static during training. In lazy execution, it is built up for each forward pass.","In lazy execution, the gradient is computed by numeric approximation, while eager execution uses the backpropagation algorithm.","In eager execution, the gradient is computed by numeric approximation, while lazy execution uses the backpropagation algorithm."], ans: 0},

      {q: "When we apply the chain rule to complex operations involving tensors for backpropagation, the local derivatives can be expensive 3-tensors. How do modern ML frameworks avoid this problem?", opts: ["They approximate the local derivative using random search.","They approximate the local derivative using the EM algorithm.","They don't compute the local derivative, but the product of the upstream derivative with the local derivative.","They don't compute the local derivative, but the product of the downstream derivative with the local derivative."], ans: 2},

// =====================
// APP STATE
// =====================
let selectedExams = new Set();
let allQuestions = [];
let currentIdx = 0;
let answers = {};
let checked = {};

// =====================
// LANDING
// =====================
function renderLanding() {
  const grid = document.getElementById('examGrid');
  grid.innerHTML = EXAMS.map(e => `
    <div class="exam-card" id="card-${e.id}" onclick="toggleExam('${e.id}')">
      <div class="check-mark">✓</div>
      <div class="card-tag">${e.tag}</div>
      <div class="card-title">${e.title}</div>
      <div class="card-meta">${e.date} · ${e.questions.length} questions</div>
    </div>
  `).join('');
}

function toggleExam(id) {
  if (selectedExams.has(id)) selectedExams.delete(id);
  else selectedExams.add(id);
  document.querySelectorAll('.exam-card').forEach(c => c.classList.remove('selected'));
  selectedExams.forEach(id => document.getElementById('card-' + id)?.classList.add('selected'));
  document.getElementById('startBtn').disabled = selectedExams.size === 0;
}

function selectAll() {
  EXAMS.forEach(e => selectedExams.add(e.id));
  document.querySelectorAll('.exam-card').forEach(c => c.classList.add('selected'));
  document.getElementById('startBtn').disabled = false;
}

function selectNone() {
  selectedExams.clear();
  document.querySelectorAll('.exam-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('startBtn').disabled = true;
}

// =====================
// QUIZ
// =====================
function startQuiz() {
  allQuestions = [];
  selectedExams.forEach(id => {
    const exam = EXAMS.find(e => e.id === id);
    if (exam) {
      exam.questions.forEach((q, i) => {
        allQuestions.push({ ...q, examId: id, examTitle: exam.title, examDate: exam.date, localIdx: i });
      });
    }
  });

  currentIdx = 0;
  answers = {};
  checked = {};

  document.getElementById('landing').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  document.getElementById('results').style.display = 'none';

  renderQuiz();
  renderQuestion(0);
}

function renderQuiz() {
  const body = document.getElementById('quizBody');
  body.innerHTML = allQuestions.map((q, i) => {
    const letters = ['A', 'B', 'C', 'D'];
    return `
      <div class="question-block" id="qblock-${i}">
        <div class="question-source">${q.examTitle} · ${q.examDate}</div>
        <div class="question-num">Q${i + 1} of ${allQuestions.length}</div>
        <div class="question-text">${q.q}</div>
        <div class="options" id="opts-${i}">
          ${q.opts.map((opt, j) => `
            <div class="option" id="opt-${i}-${j}" onclick="selectOpt(${i}, ${j})">
              <div class="option-letter">${letters[j]}</div>
              <div class="option-text">${opt}</div>
            </div>
          `).join('')}
        </div>
        <div class="feedback" id="feedback-${i}"></div>
        <div class="nav-row">
          <button class="btn-check" id="check-${i}" onclick="checkAnswer(${i})" disabled>Check answer</button>
          <button class="btn-next" onclick="nextQ(${i})" style="display:none" id="next-${i}">Next →</button>
          <button class="skip-btn" onclick="nextQ(${i})">Skip</button>
        </div>
      </div>
    `;
  }).join('');
}

function renderQuestion(idx) {
  document.querySelectorAll('.question-block').forEach(b => b.classList.remove('active'));
  const block = document.getElementById('qblock-' + idx);
  if (block) block.classList.add('active');

  const total = allQuestions.length;
  document.getElementById('progressText').textContent = `${idx + 1} / ${total}`;
  document.getElementById('progressBar').style.width = ((idx + 1) / total * 100) + '%';

  const examTitle = allQuestions[idx]?.examTitle || 'ML Practice';
  document.getElementById('quizTitle').textContent = examTitle;
}

function selectOpt(qIdx, optIdx) {
  if (checked[qIdx]) return;
  answers[qIdx] = optIdx;
  document.querySelectorAll(`#opts-${qIdx} .option`).forEach(o => o.classList.remove('selected'));
  document.getElementById(`opt-${qIdx}-${optIdx}`).classList.add('selected');
  document.getElementById(`check-${qIdx}`).disabled = false;
}

function checkAnswer(qIdx) {
  if (checked[qIdx]) return;
  checked[qIdx] = true;

  const q = allQuestions[qIdx];
  const userAns = answers[qIdx];
  const correct = q.ans;
  const isCorrect = userAns === correct;

  // Lock all options
  document.querySelectorAll(`#opts-${qIdx} .option`).forEach((o, j) => {
    o.classList.add('locked');
    if (j === correct) o.classList.add('correct');
    else if (j === userAns && !isCorrect) o.classList.add('wrong');
  });

  const fb = document.getElementById(`feedback-${qIdx}`);
  if (isCorrect) {
    fb.textContent = '✓ Correct!';
    fb.className = 'feedback correct';
  } else {
    const letters = ['A', 'B', 'C', 'D'];
    fb.textContent = `✗ Incorrect. The correct answer is ${letters[correct]}.`;
    fb.className = 'feedback wrong';
  }

  document.getElementById(`check-${qIdx}`).disabled = true;
  document.getElementById(`next-${qIdx}`).style.display = 'inline-block';

  // Hide skip when check was done
  const navRow = document.querySelector(`#qblock-${qIdx} .skip-btn`);
  if (navRow) navRow.style.display = 'none';
}

function nextQ(qIdx) {
  if (currentIdx < allQuestions.length - 1) {
    currentIdx++;
    renderQuestion(currentIdx);
    // Scroll to top
    document.querySelector('.quiz-header').scrollIntoView({ behavior: 'smooth' });
  } else {
    showResults();
  }
}

// =====================
// RESULTS
// =====================
function showResults() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('results').style.display = 'block';

  let correct = 0;
  let attempted = 0;

  // Per-exam breakdown
  const byExam = {};
  EXAMS.forEach(e => {
    if (selectedExams.has(e.id)) byExam[e.id] = { title: e.title, correct: 0, total: 0 };
  });

  allQuestions.forEach((q, i) => {
    if (checked[i]) {
      attempted++;
      byExam[q.examId].total++;
      if (answers[i] === q.ans) {
        correct++;
        byExam[q.examId].correct++;
      }
    }
  });

  const total = allQuestions.length;
  const pct = total > 0 ? Math.round(correct / total * 100) : 0;
  const attemptedPct = total > 0 ? Math.round(attempted / total * 100) : 0;

  document.getElementById('scoreNum').textContent = pct + '%';

  // Animate circle
  const circle = document.getElementById('scoreCircle');
  const circumference = 376.99;
  setTimeout(() => {
    circle.style.strokeDashoffset = circumference - (pct / 100) * circumference;
    circle.style.transition = 'stroke-dashoffset 1s ease';
  }, 100);

  const grade = document.getElementById('resultGrade');
  if (pct >= 63) { grade.textContent = 'Pass'; grade.className = 'result-grade pass'; }
  else if (pct >= 55) { grade.textContent = 'Borderline'; grade.className = 'result-grade borderline'; }
  else { grade.textContent = 'Not yet'; grade.className = 'result-grade fail'; }

  document.getElementById('resultDetail').textContent =
    `${correct} correct out of ${attempted} answered (${total} total questions)`;

  // Breakdown
  const bd = document.getElementById('breakdown');
  bd.innerHTML = `<div class="breakdown-title">Per exam</div>` +
    Object.values(byExam).map(e => `
      <div class="brow">
        <span class="brow-name">${e.title}</span>
        <span class="brow-score">${e.correct}/${e.total}</span>
      </div>
    `).join('');
}

function restartSame() {
  currentIdx = 0;
  answers = {};
  checked = {};
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  renderQuiz();
  renderQuestion(0);
}

function goHome() {
  document.getElementById('results').style.display = 'none';
  document.getElementById('landing').style.display = 'flex';
}

// =====================
// INIT
// =====================
renderLanding();
</script>
</body>
</html>
