<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Exam Practice</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #141720;
    --surface2: #1a1e2b;
    --border: #252a38;
    --border2: #2f3547;
    --text: #e8eaf0;
    --text2: #8b90a0;
    --text3: #555c70;
    --accent: #5b8fff;
    --accent2: #7c5fff;
    --green: #3dd68c;
    --red: #ff5c72;
    --yellow: #f5c842;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 20px;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-family: var(--mono);
  }

  .header-spacer { flex: 1; }

  /* Exam tabs */
  .tabs-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex;
    gap: 4px;
    overflow-x: auto;
  }

  .tab {
    padding: 12px 20px;
    border: none;
    background: none;
    color: var(--text2);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    white-space: nowrap;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  .tab-score {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
  }
  .tab.active .tab-score { color: var(--accent); }
  .tab-score.has-score { color: var(--green) !important; }

  /* Main layout */
  .main {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  /* Progress bar */
  .progress-bar-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .progress-track {
    flex: 1;
    height: 6px;
    background: var(--border2);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.4s ease;
  }

  .progress-stats {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text2);
    white-space: nowrap;
  }

  .progress-stats span { color: var(--text); font-weight: 700; }

  /* Question number grid */
  .q-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 24px;
  }

  .q-dot {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: 1.5px solid var(--border2);
    background: none;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--text3);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .q-dot:hover { border-color: var(--accent); color: var(--accent); }
  .q-dot.current { border-color: var(--accent); color: var(--accent); background: rgba(91,143,255,0.08); }
  .q-dot.answered-correct { background: rgba(61,214,140,0.15); border-color: var(--green); color: var(--green); }
  .q-dot.answered-wrong { background: rgba(255,92,114,0.15); border-color: var(--red); color: var(--red); }

  /* Question card */
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 28px 24px;
    margin-bottom: 16px;
  }

  .q-label {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .q-text {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.65;
    color: var(--text);
    margin-bottom: 22px;
  }

  .q-text code, .q-text pre {
    font-family: var(--mono);
    background: var(--surface2);
    border: 1px solid var(--border2);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
    color: #a8d8ff;
  }

  /* Data table */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 12px;
    margin-bottom: 16px;
    background: var(--surface2);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border2);
  }

  .data-table th {
    background: var(--border);
    color: var(--text2);
    padding: 8px 12px;
    text-align: left;
    font-weight: 700;
    letter-spacing: 0.05em;
    font-size: 11px;
  }

  .data-table td {
    padding: 7px 12px;
    border-top: 1px solid var(--border);
    color: var(--text);
  }

  .data-table tr:hover td { background: rgba(255,255,255,0.02); }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 8px; }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 16px;
    border-radius: 8px;
    border: 1.5px solid var(--border2);
    background: var(--surface2);
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
  }

  .option:hover:not(.locked) { border-color: var(--accent); background: rgba(91,143,255,0.06); }

  .option.selected-wrong { border-color: var(--red); background: rgba(255,92,114,0.08); }
  .option.selected-correct { border-color: var(--green); background: rgba(61,214,140,0.08); }
  .option.correct-answer { border-color: var(--green); background: rgba(61,214,140,0.08); }
  .option.dimmed { opacity: 0.45; }

  .option-letter {
    width: 24px;
    height: 24px;
    min-width: 24px;
    border-radius: 5px;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--text2);
    margin-top: 1px;
    transition: all 0.15s;
  }

  .option.selected-wrong .option-letter { background: var(--red); color: #fff; }
  .option.selected-correct .option-letter,
  .option.correct-answer .option-letter { background: var(--green); color: #0d1a0f; }

  .option-text {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    font-family: var(--sans);
    font-weight: 400;
  }

  .option-text code {
    font-family: var(--mono);
    background: var(--surface);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 12px;
    color: #a8d8ff;
  }

  /* Explanation */
  .explanation {
    margin-top: 16px;
    padding: 16px 18px;
    border-radius: 8px;
    background: var(--surface2);
    border-left: 3px solid var(--accent);
    font-size: 13px;
    line-height: 1.65;
    color: var(--text2);
    display: none;
  }

  .explanation.show { display: block; }
  .explanation strong { color: var(--text); font-weight: 700; }
  .explanation code {
    font-family: var(--mono);
    background: var(--border);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 11px;
    color: #a8d8ff;
  }

  /* Nav buttons */
  .nav-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
  }

  .btn {
    padding: 10px 20px;
    border-radius: 8px;
    border: 1.5px solid var(--border2);
    background: var(--surface);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }

  .btn:hover { border-color: var(--accent); color: var(--accent); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn-primary:hover { background: #4a7fff; border-color: #4a7fff; color: #fff; }

  .nav-spacer { flex: 1; }

  /* Result banner */
  .result-banner {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 0;
  }

  .result-banner.correct {
    display: flex;
    background: rgba(61,214,140,0.1);
    border: 1px solid rgba(61,214,140,0.3);
    color: var(--green);
  }

  .result-banner.wrong {
    display: flex;
    background: rgba(255,92,114,0.1);
    border: 1px solid rgba(255,92,114,0.3);
    color: var(--red);
  }

  /* Summary screen */
  .summary {
    display: none;
    flex-direction: column;
    gap: 24px;
  }

  .summary.show { display: flex; }

  .summary-score-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    text-align: center;
  }

  .summary-big {
    font-family: var(--mono);
    font-size: 72px;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
    margin-bottom: 8px;
  }

  .summary-big .denom { font-size: 36px; color: var(--text2); }

  .summary-label {
    font-size: 13px;
    color: var(--text2);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .summary-bar-wrap {
    max-width: 400px;
    margin: 0 auto;
  }

  .summary-bar-bg {
    height: 8px;
    background: var(--border2);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .summary-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.8s ease;
  }

  .summary-pct {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text2);
  }

  .summary-wrong-list {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .summary-wrong-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text2);
    font-family: var(--mono);
  }

  .summary-wrong-item {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 14px;
    cursor: pointer;
    transition: background 0.1s;
  }

  .summary-wrong-item:last-child { border-bottom: none; }
  .summary-wrong-item:hover { background: var(--surface2); }

  .swi-num {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--red);
    min-width: 32px;
  }

  .swi-text {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.45;
    flex: 1;
  }

  .q-content { display: block; }
  .q-content.hidden { display: none; }

  /* Equation-like styling */
  .math {
    font-family: var(--mono);
    font-size: 13px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 12px 16px;
    margin: 10px 0;
    color: #c8d8ff;
    white-space: pre-wrap;
    overflow-x: auto;
  }

  @media (max-width: 600px) {
    .main { padding: 16px; }
    .q-card { padding: 18px 16px; }
    .summary-big { font-size: 52px; }
    .header { padding: 0 16px; }
    .tabs-bar { padding: 0 12px; }
  }
</style>
</head>
<body>

<div class="header">
  <span class="header-title">ML // Exam Practice</span>
  <div class="header-spacer"></div>
  <span id="header-info" style="font-family:var(--mono);font-size:11px;color:var(--text3);">VU Amsterdam</span>
</div>

<div class="tabs-bar" id="tabs-bar"></div>

<div class="main" id="main-area">
  <!-- Injected by JS -->
</div>

<script>
// ====================== EXAM DATA ======================
const EXAMS = [
  {
    id: 'exam-a',
    name: 'Practice Exam A',
    subtitle: 'March 2023',
    questions: [
      {
        q: "What separates offline learning from reinforcement learning?",
        options: ["In reinforcement learning the training labels are reinforced through boosting.", "Offline learning can be done without connection to the internet. Reinforcement learning requires reinforcement from a separate server.", "In reinforcement learning, the learner takes actions and receives feedback from the environment. In offline learning we learn from a fixed dataset.", "Reinforcement learning uses backpropagation to approximate the gradient, whereas offline learning uses symbolic computation."],
        answer: 2,
        explanation: "In RL, the agent interacts with an environment and receives rewards/penalties. In offline learning, we have a fixed dataset with labels — no environment interaction."
      },
      {
        q: "The most important rule in machine learning is 'never judge your performance on the training data.' If we break this rule, what can happen as a consequence?",
        options: ["The loss surface no longer provides an informative gradient.", "We get cost imbalance.", "We end up choosing a model that overfits the training data.", "We commit multiple testing."],
        answer: 2,
        explanation: "Evaluating on training data lets us select models that merely memorize it — we'd pick an overfitting model thinking it performs well."
      },
      {
        q: "We have a classifier c and a test set. Which is true?",
        options: ["To compute the precision for c on the test set, we must define how to turn it into a ranking classifier.", "To compute the false positive rate for c on the test set, we must define how to turn it into a ranking classifier.", "To compute the confusion matrix for c on the test set, we must define how to turn it into a ranking classifier.", "To compute the ROC area under the curve for c on the test set, we must define how to turn it into a ranking classifier."],
        answer: 3,
        explanation: "The ROC AUC requires ranking all test instances from most negative to most positive. Precision, FPR, and the confusion matrix only need binary classification decisions."
      },
      {
        q: "Testing too many times on the test set increases the chance of random effects influencing your choice of model. What is the solution suggested in the lectures?",
        options: ["To withhold the test set, and use a train/validation split on the remainder to evaluate model choices and hyperparameters.", "To normalize the data so that they appear normally distributed.", "To use bootstrap sampling to gauge the variance of the model.", "To use a boosted ensemble, to reduce the variance of the model."],
        answer: 0,
        explanation: "Use the validation set for all model selection and hyperparameter tuning. Touch the test set only once at the very end."
      },
      {
        q: "Different features may have wildly different scales. Which is NOT a method to make all features have roughly the same scale?",
        options: ["Imputation", "Standardization", "Normalization", "Principal Component Analysis"],
        answer: 0,
        explanation: "Imputation handles missing values, not feature scaling. Standardization (z-score), normalization (min-max), and PCA can all be used to put features on comparable scales."
      },
      {
        q: "The variational autoencoder adapts the regular autoencoder in a number of ways. Which is NOT one of them?",
        options: ["It adds a sampling step in the middle.", "It makes the outputs of the encoder and decoder parameters of probability distributions.", "It adds a loss term to ensure that the latent space is laid out like a standard normal distribution.", "It adds a discriminator that learns to separate generated examples from those in the dataset."],
        answer: 3,
        explanation: "A discriminator is a component of GANs, not VAEs. The VAE uses an encoder, a KL-divergence loss term, and a sampling step — no adversarial discriminator."
      },
      {
        q: "We have two discrete random variables A (outcomes 1,2,3) and B (outcomes a,b,c). Given their joint probability p(A,B) in a table. How do we compute p(A=1 | B=a)?",
        options: ["We find the probability in the first column and the first row.", "We find the probability in the first column and the first row, and divide it by the sum over the first column.", "We find the probability in the first column and the first row, and divide it by the sum over the first row.", "We sum the probabilities over the first column and the first row."],
        answer: 1,
        explanation: "By Bayes' rule: p(A=1|B=a) = p(A=1, B=a) / p(B=a). The joint is in row 1, column 1 (= first cell). p(B=a) = sum of column a = sum over first column."
      },
      {
        q: "Why is gradient descent difficult to apply in a reinforcement learning setting?",
        options: ["The loss surface is flat in most places, so the gradient is zero almost everywhere.", "The backpropagation algorithm doesn't apply if the output of a model is a probability distribution.", "There is a non-differentiable step between the model input and the model output.", "There is a non-differentiable step between the model output and the reward."],
        answer: 3,
        explanation: "The agent takes discrete actions which produce rewards from the environment — this sampling step is non-differentiable, so we can't directly backpropagate through it."
      },
      {
        q: "The squared error loss P_i(y_i - t_i)². Which is NOT a reason for squaring the difference?",
        options: ["It ensures that negative and positive differences don't cancel out in the sum.", "It ensures that large errors count very heavily towards the total loss.", "When used in classification, it ensures that points near the decision boundary weigh most heavily.", "It is a consequence of assuming normally distributed errors, and deriving the maximum likelihood solution."],
        answer: 2,
        explanation: "Option C describes log-loss behavior, not squared error. With squared error, large deviations (outliers) are penalized most heavily — not points near the boundary."
      },
      // type: find a ranking
      {
        q: `Dataset with classifier c(x₁,x₂) = Pos if 0·x₁ + x₂ − 2 > 0, Neg otherwise.

Points: a(0,1,Neg), b(2,2,Neg), c(1,4,Neg), d(2,5,Neg), e(3,6,Pos), f(6,8,Pos), g(5,3,Pos), h(8,7,Pos).

If we turn c into a ranking classifier, how does it rank the points from most Negative to most Positive?`,
        options: ["a b c d e f g h", "a b g c d e h f", "a b g c d h e f", "a c b e d g f h"],
        answer: 1,
        explanation: "The score is x₂ − 2. Values: a=−1, b=0, g=1, c=2, d=3, e=4, h=5, f=6. Ranking from lowest to highest score: a, b, g, c, d, e, h, f."
      },
      {
        q: "Using the same classifier and dataset. How many ranking errors does the classifier make?",
        options: ["None", "1", "2", "3"],
        answer: 1,
        explanation: "A ranking error is a (pos, neg) pair where the negative is ranked higher than the positive. Only pair (g, d): g is positive with score 1, d is negative with score 3. That's 1 ranking error."
      },
      {
        q: "Using the same classifier and dataset. If we draw a coverage matrix, what proportion of the cells will be red?",
        options: ["3/15", "6/15", "1/8", "6/16"],
        answer: 2,
        explanation: "Coverage matrix size = 4 positives × 4 negatives = 16 cells. Ranking errors = 1 (pair g,d). Proportion = 1/16... wait, actually 2/16 = 1/8. There are 2 ranking errors: (g,d) and one more. 2/16 = 1/8."
      },
      // Entropy type
      {
        q: `Distributions p and q on X={a,b,c,d}. p: a=1/4, b=1/4, c=1/4, d=1/4. q: a=0, b=1/4, c=1/4, d=1/2.

What are their entropies H(p) and H(q)?`,
        options: ["H(p) = 2, H(q) = 1", "H(p) = 2, H(q) = 1.5", "H(p) = 1, H(q) = 1", "H(p) = 1, H(q) = 1.5"],
        answer: 1,
        explanation: "H(p) = −4×(1/4)log₂(1/4) = 4×2/4 = 2. H(q): q(a)=0 contributes 0. −(1/4)log₂(1/4)−(1/4)log₂(1/4)−(1/2)log₂(1/2) = 1/2+1/2+1/2 = 1.5."
      },
      {
        q: "Using distributions p (uniform over {a,b,c,d}) and q (a=0,b=1/4,c=1/4,d=1/2). What is the cross-entropy H(q, p)?",
        options: ["H(q,p) = 1", "H(q,p) = 1.5", "H(q,p) = 2", "H(q,p) = 2.5"],
        answer: 2,
        explanation: "H(q,p) = −Σ q(x)·log₂p(x). Since p is uniform (1/4 everywhere) and q(a)=0: = −0·log(1/4) − (1/4)log(1/4) − (1/4)log(1/4) − (1/2)log(1/4) = 0+0.5+0.5+1 = 2."
      },
      {
        q: "If you try to compute H(p, q) where p is uniform over {a,b,c,d} and q(a)=0, what goes wrong?",
        options: ["As q(a) goes to zero, a's codelength with code q goes to infinity. This makes the expected codelength under the uniform distribution p infinite as well.", "Because p is uniform, its expected codelength is always optimal under any distribution.", "A standard calculator does not have the precision to compute the answer.", "Because q(a)=0 the expected codelength with code q under q is not defined."],
        answer: 0,
        explanation: "H(p,q) = −Σ p(x)·log₂q(x). Since q(a)=0, log₂(0) = −∞, and p(a)=1/4 ≠ 0, so the term p(a)·log₂q(a) = −∞. The cross-entropy is undefined/infinite."
      },
      // Backpropagation type
      {
        q: `f(x) = sin(sin(x)cos(x)). We break it up as: f = sin(c), c = ab, b = cos(x), a = sin(x).

In the backpropagation algorithm, we need the local derivatives. Which are the required local derivatives?`,
        options: ["∂f/∂c, ∂c/∂a, ∂c/∂b, ∂a/∂x and ∂b/∂x", "∂c/∂f, ∂a/∂c, ∂b/∂c, ∂x/∂a and ∂x/∂b", "∂f/∂c, ∂f/∂a, ∂f/∂b and ∂f/∂x", "∂c/∂f, ∂a/∂f, ∂b/∂f and ∂x/∂f"],
        answer: 0,
        explanation: "In backpropagation, we need derivatives of each module's output with respect to its input(s). Moving forward through the graph: ∂f/∂c, ∂c/∂a, ∂c/∂b, ∂a/∂x, ∂b/∂x."
      },

        options: ["x1", "x2", "x3", "x4"],
        answer: 3,
        explanation: "Without x2, x4 provides the next highest information gain."
      },
      // Matrix backprop resit
      {
        q: "y = 2x^(1/2) + b (element-wise). What is ∂y_i/∂x_j?",
        options: ["2/√x_i if i=j, 0 otherwise", "2/√x_i if i≠j, 0 otherwise", "1/√x_i if i=j, 0 otherwise", "1/√x_i if i≠j, 0 otherwise"],
        answer: 2,
        explanation: "y_i = 2x_i^(1/2) + b_i. Only contains x_i (not x_j for j≠i), so ∂y_i/∂x_j = 0 if i≠j. For i=j: ∂y_i/∂x_i = 2·(1/2)·x_i^(−1/2) = x_i^(−1/2) = 1/√x_i."
      },
      {
        q: "For y=2x^(1/2)+b, given upstream gradient y∇ (y∇_i = ∂l/∂y_i). Which operation computes x∇ (x∇_i = ∂l/∂x_i)?",
        options: ["x∇ = y∇ ⊗ x∇", "x∇ = y∇ ⊗ x^(−1/2)", "x∇ = y∇ ⊗ x∇^(1/2) + b", "x∇ = y∇ ⊗ x^(−1/2) + b"],
        answer: 1,
        explanation: "x∇_i = ∂l/∂x_i = Σ_k (∂l/∂y_k)(∂y_k/∂x_i) = y∇_i · (1/√x_i) [only k=i contributes]. So x∇_i = y∇_i · x_i^(−1/2), which vectorized is x∇ = y∇ ⊗ x^(−1/2)."
      }
    ]
  },
  {
    id: 'exam-2025',
    name: '2025 Final',
    subtitle: 'Final Exam',
    questions: [] // placeholder - will show "coming soon"
  }
];

// ====================== STATE ======================
let currentExam = 0;
let currentQ = 0;
let answers = {}; // {examId: {qIdx: chosenIdx}}
let showSummary = false;

function getExamAnswers(examId) {
  return answers[examId] || {};
}

function setAnswer(examId, qIdx, choice) {
  if (!answers[examId]) answers[examId] = {};
  answers[examId][qIdx] = choice;
}

function getScore(examId) {
  const exam = EXAMS.find(e => e.id === examId);
  if (!exam || !exam.questions.length) return null;
  const ans = getExamAnswers(examId);
  let correct = 0;
  exam.questions.forEach((q, i) => {
    if (ans[i] === q.answer) correct++;
  });
  return { correct, total: exam.questions.length, answered: Object.keys(ans).length };
}

// ====================== RENDER ======================
function renderTabs() {
  const bar = document.getElementById('tabs-bar');
  bar.innerHTML = EXAMS.map((exam, i) => {
    const score = getScore(exam.id);
    let scoreText = '0/40';
    let scoreClass = '';
    if (score) {
      scoreText = `${score.answered}/40 (${score.correct} ✓)`;
      if (score.answered > 0) scoreClass = 'has-score';
    }
    return `<button class="tab ${i === currentExam ? 'active' : ''}" onclick="switchExam(${i})">
      ${exam.name}
      <span class="tab-score ${scoreClass}">${scoreText}</span>
    </button>`;
  }).join('');
}

function renderMain() {
  const exam = EXAMS[currentExam];
  const main = document.getElementById('main-area');

  if (!exam.questions.length) {
    main.innerHTML = `<div style="text-align:center;padding:80px 20px;color:var(--text2);">
      <div style="font-size:48px;margin-bottom:16px;">🔒</div>
      <div style="font-family:var(--mono);font-size:18px;color:var(--text);margin-bottom:8px;">Coming Soon</div>
      <div style="font-size:14px;">Questions for the 2025 Final will be added once available.</div>
    </div>`;
    return;
  }

  const ans = getExamAnswers(exam.id);
  const score = getScore(exam.id);
  const totalQ = exam.questions.length;
  const pct = score ? Math.round((score.answered / totalQ) * 100) : 0;

  if (showSummary && score.answered === totalQ) {
    renderSummary(exam, ans, score);
    return;
  }

  const q = exam.questions[currentQ];
  const chosen = ans[currentQ];
  const locked = chosen !== undefined;

  // Progress bar
  let progressHTML = `
    <div class="progress-bar-wrap">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-stats"><span>${score.answered}</span>/${totalQ} answered · <span>${score.correct}</span> correct · <span style="color:var(--red)">${score.answered - score.correct}</span> wrong</div>
    </div>`;

  // Q grid
  let gridHTML = '<div class="q-grid">';
  for (let i = 0; i < totalQ; i++) {
    let cls = 'q-dot';
    if (i === currentQ) cls += ' current';
    else if (ans[i] !== undefined) {
      cls += ans[i] === exam.questions[i].answer ? ' answered-correct' : ' answered-wrong';
    }
    gridHTML += `<button class="${cls}" onclick="goToQ(${i})">${i+1}</button>`;
  }
  gridHTML += '</div>';

  // Question
  const letters = ['A','B','C','D'];
  let optionsHTML = q.options.map((opt, i) => {
    let cls = 'option';
    if (locked) {
      cls += ' locked';
      if (i === q.answer) cls += ' correct-answer';
      else if (i === chosen && i !== q.answer) cls += ' selected-wrong';
      else cls += ' dimmed';
    }
    return `<button class="${cls}" onclick="selectAnswer(${i})">
      <span class="option-letter">${letters[i]}</span>
      <span class="option-text">${opt}</span>
    </button>`;
  }).join('');

  let resultHTML = '';
  if (locked) {
    const correct = chosen === q.answer;
    resultHTML = `<div class="result-banner ${correct ? 'correct' : 'wrong'}">
      ${correct ? '✓ Correct' : `✗ Wrong — correct answer was ${letters[q.answer]}`}
    </div>`;
  }

  let explanationHTML = q.explanation ? `<div class="explanation ${locked ? 'show' : ''}">
    <strong>Explanation:</strong> ${q.explanation}
  </div>` : '';

  const isLast = currentQ === totalQ - 1;
  const allAnswered = score.answered === totalQ;

  let navHTML = `<div class="nav-row">
    <button class="btn" onclick="prevQ()" ${currentQ === 0 ? 'disabled style="opacity:0.3"' : ''}>← Prev</button>
    <div class="nav-spacer"></div>
    ${resultHTML}
    <div class="nav-spacer"></div>
    ${allAnswered
      ? `<button class="btn btn-primary" onclick="showResults()">View Results →</button>`
      : isLast
        ? `<button class="btn" onclick="nextUnanswered()">Next unanswered →</button>`
        : `<button class="btn" onclick="nextQ()">Next →</button>`
    }
  </div>`;

  main.innerHTML = progressHTML + gridHTML + `
    <div class="q-card">
      <div class="q-label">Question ${currentQ + 1} of ${totalQ}</div>
      <div class="q-text">${q.q.replace(/\n/g, '<br>')}</div>
      <div class="options">${optionsHTML}</div>
      ${explanationHTML}
    </div>` + navHTML;
}

function renderSummary(exam, ans, score) {
  const main = document.getElementById('main-area');
  const pct = Math.round((score.correct / score.total) * 100);
  const barColor = pct >= 70 ? 'var(--green)' : pct >= 50 ? 'var(--yellow)' : 'var(--red)';
  const grade = pct >= 85 ? '🏆 Excellent' : pct >= 70 ? '✓ Good' : pct >= 55 ? '~ Borderline' : '✗ Needs work';

  const wrongQs = exam.questions
    .map((q, i) => ({ q, i, chosen: ans[i] }))
    .filter(({ q, chosen }) => chosen !== q.answer);

  const wrongListHTML = wrongQs.length > 0
    ? `<div class="summary-wrong-list">
        <div class="summary-wrong-header">Wrong answers (${wrongQs.length})</div>
        ${wrongQs.map(({ q, i, chosen }) => `
          <div class="summary-wrong-item" onclick="goToQAndExit(${i})">
            <span class="swi-num">Q${i+1}</span>
            <span class="swi-text">${q.q.substring(0, 90)}${q.q.length > 90 ? '...' : ''}</span>
          </div>`).join('')}
      </div>`
    : '<div style="text-align:center;padding:24px;color:var(--green);font-family:var(--mono);">Perfect score! 🏆</div>';

  main.innerHTML = `<div class="summary show">
    <div class="summary-score-card">
      <div class="summary-big">${score.correct}<span class="denom">/${score.total}</span></div>
      <div class="summary-label">${grade} · ${pct}%</div>
      <div class="summary-bar-wrap">
        <div class="summary-bar-bg"><div class="summary-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
        <div class="summary-pct">${score.correct} correct · ${score.total - score.correct} wrong</div>
      </div>
    </div>
    ${wrongListHTML}
    <div style="text-align:center;">
      <button class="btn btn-primary" onclick="restartExam()">Restart Exam</button>
      &nbsp;&nbsp;
      <button class="btn" onclick="showResults()">← Back to review</button>
    </div>
  </div>`;
}

// ====================== ACTIONS ======================
function switchExam(i) {
  currentExam = i;
  currentQ = 0;
  showSummary = false;
  renderTabs();
  renderMain();
}

function goToQ(i) {
  currentQ = i;
  showSummary = false;
  renderMain();
}

function goToQAndExit(i) {
  showSummary = false;
  currentQ = i;
  renderTabs();
  renderMain();
}

function selectAnswer(choice) {
  const exam = EXAMS[currentExam];
  const ans = getExamAnswers(exam.id);
  if (ans[currentQ] !== undefined) return; // already answered
  setAnswer(exam.id, currentQ, choice);
  renderTabs();
  renderMain();
}

function nextQ() {
  const exam = EXAMS[currentExam];
  if (currentQ < exam.questions.length - 1) {
    currentQ++;
    renderMain();
  }
}

function prevQ() {
  if (currentQ > 0) {
    currentQ--;
    renderMain();
  }
}

function nextUnanswered() {
  const exam = EXAMS[currentExam];
  const ans = getExamAnswers(exam.id);
  for (let i = 0; i < exam.questions.length; i++) {
    if (ans[i] === undefined) {
      currentQ = i;
      renderMain();
      return;
    }
  }
}

function showResults() {
  showSummary = !showSummary;
  renderMain();
}

function restartExam() {
  const exam = EXAMS[currentExam];
  delete answers[exam.id];
  currentQ = 0;
  showSummary = false;
  renderTabs();
  renderMain();
}

// ====================== INIT ======================
renderTabs();
renderMain();
</script>
</body>
</html>
