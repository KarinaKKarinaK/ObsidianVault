<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Mining — Final Exam Practice</title>
<style>
  :root {
    --navy: #0d1b2a;
    --navy2: #1b2e45;
    --teal: #1e7f8e;
    --teal-light: #27a7b8;
    --teal-dim: #154f5c;
    --gold: #e8c45a;
    --white: #f0f4f8;
    --text: #cdd6e0;
    --text-dim: #8ca0b4;
    --green: #3ecf8e;
    --red: #f05f6a;
    --red-dim: #7a1c25;
    --green-dim: #0e4f2e;
    --card: #162232;
    --border: #243650;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--navy);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  header {
    background: var(--navy2);
    border-bottom: 2px solid var(--teal);
    padding: 18px 24px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  header h1 {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 0;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 6px 6px 0 0;
    border: 1px solid var(--border);
    border-bottom: none;
    background: var(--navy);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .tab:hover { background: var(--navy2); color: var(--text); }
  .tab.active {
    background: var(--teal);
    color: #fff;
    border-color: var(--teal);
  }
  .tab .badge {
    display: inline-block;
    margin-left: 6px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 0.7rem;
  }
  .tab.scored .badge { background: var(--gold); color: var(--navy); }

  main { max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }

  .exam-panel { display: none; }
  .exam-panel.active { display: block; }

  .exam-header {
    margin-bottom: 28px;
  }
  .exam-header h2 {
    font-size: 1.4rem;
    color: var(--white);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .exam-header p { color: var(--text-dim); font-size: 0.9rem; }

  .score-banner {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--teal);
    border-radius: 10px;
    padding: 20px 24px;
    margin-bottom: 28px;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .score-banner.visible { display: flex; }
  .score-num {
    font-size: 2.8rem;
    font-weight: 800;
    color: var(--gold);
    line-height: 1;
  }
  .score-label { font-size: 0.85rem; color: var(--text-dim); margin-top: 2px; }
  .score-pct {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--teal-light);
  }
  .retake-btn {
    margin-left: auto;
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: background 0.15s;
  }
  .retake-btn:hover { background: var(--teal-light); }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  .question-card.correct { border-left: 4px solid var(--green); }
  .question-card.wrong { border-left: 4px solid var(--red); }
  .question-card.unanswered { border-left: 4px solid var(--gold); }

  .q-num {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--teal-light);
    margin-bottom: 8px;
  }
  .q-text {
    font-size: 0.98rem;
    color: var(--white);
    font-weight: 500;
    margin-bottom: 14px;
    line-height: 1.5;
  }

  .options { display: flex; flex-direction: column; gap: 8px; }

  .option-label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--navy2);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
    font-size: 0.92rem;
    line-height: 1.5;
  }
  .option-label:hover { background: var(--navy); border-color: var(--teal-dim); }
  .option-label input[type="radio"] { flex-shrink: 0; margin-top: 3px; accent-color: var(--teal-light); }

  /* After submission styling */
  .option-label.is-correct {
    background: var(--green-dim);
    border-color: var(--green);
    color: var(--green);
    font-weight: 600;
  }
  .option-label.is-wrong-pick {
    background: var(--red-dim);
    border-color: var(--red);
    color: var(--red);
  }
  .option-label.dimmed { opacity: 0.45; }

  .result-icon {
    display: none;
    margin-top: 10px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .result-icon.correct { color: var(--green); display: block; }
  .result-icon.wrong { color: var(--red); display: block; }
  .result-icon.unanswered { color: var(--gold); display: block; }

  .actions {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 32px;
  }
  .submit-btn {
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 32px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: background 0.15s;
  }
  .submit-btn:hover { background: var(--teal-light); }
  .submit-btn:disabled { background: var(--border); color: var(--text-dim); cursor: default; }

  .warning-msg {
    color: var(--gold);
    font-size: 0.88rem;
    font-weight: 600;
    display: none;
  }
  .warning-msg.visible { display: block; }

  @media (max-width: 600px) {
    header h1 { font-size: 0.95rem; }
    .tab { padding: 7px 10px; font-size: 0.7rem; }
    main { padding: 18px 12px 50px; }
    .score-num { font-size: 2rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Text Mining — Final Exam Practice</h1>
  <div class="tabs" id="tabBar"></div>
</header>

<main id="mainContent"></main>

        <p>${exam.questions.length} questions &nbsp;·&nbsp; Select one answer per question, then submit.</p>
      </div>
      <div class="score-banner" id="score-${ei}">
        <div>
          <div class="score-num" id="score-num-${ei}">—</div>
          <div class="score-label">Questions correct</div>
        </div>
        <div class="score-pct" id="score-pct-${ei}"></div>
        <button class="retake-btn" onclick="retake(${ei})">↺ Retake</button>
      </div>
      <div id="questions-${ei}"></div>
      <div class="actions">
        <button class="submit-btn" id="submit-${ei}" onclick="submitExam(${ei})">Submit Exam</button>
        <span class="warning-msg" id="warn-${ei}">Please answer all questions before submitting.</span>
      </div>
    `;
    main.appendChild(panel);

    // Build questions
    const qContainer = panel.querySelector(`#questions-${ei}`);
    exam.questions.forEach((q, qi) => {
      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = `card-${ei}-${qi}`;

      let optHtml = '';
      q.options.forEach((opt, oi) => {
        optHtml += `
          <label class="option-label" id="lbl-${ei}-${qi}-${oi}">
            <input type="radio" name="q-${ei}-${qi}" value="${oi}" id="r-${ei}-${qi}-${oi}">
            <span><strong>${LETTERS[oi]})</strong> ${escapeHtml(opt)}</span>
          </label>`;
      });

      card.innerHTML = `
        <div class="q-num">Question ${qi+1} of ${exam.questions.length}</div>
        <div class="q-text">${escapeHtml(q.q)}</div>
        <div class="options">${optHtml}</div>
        <div class="result-icon" id="result-${ei}-${qi}"></div>
      `;
      qContainer.appendChild(card);
    });
  });
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function switchExam(ei) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.exam-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab')[ei].classList.add('active');
  document.getElementById(`panel-${ei}`).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function submitExam(ei) {
  const exam = EXAMS[ei];
  const n = exam.questions.length;

  // Check all answered
  let allAnswered = true;
  for (let qi = 0; qi < n; qi++) {
    const picked = document.querySelector(`input[name="q-${ei}-${qi}"]:checked`);
    if (!picked) { allAnswered = false; break; }
  }

  const warn = document.getElementById(`warn-${ei}`);
  if (!allAnswered) {
    warn.classList.add('visible');
    // Scroll to first unanswered
    for (let qi = 0; qi < n; qi++) {
      const picked = document.querySelector(`input[name="q-${ei}-${qi}"]:checked`);
      if (!picked) {
        document.getElementById(`card-${ei}-${qi}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
        break;
      }
    }
    return;
  }
  warn.classList.remove('visible');

  let score = 0;

  for (let qi = 0; qi < n; qi++) {
    const picked = parseInt(document.querySelector(`input[name="q-${ei}-${qi}"]:checked`).value);
    const correct = exam.questions[qi].correct;
    const card = document.getElementById(`card-${ei}-${qi}`);
    const resultDiv = document.getElementById(`result-${ei}-${qi}`);

    // Disable inputs
    for (let oi = 0; oi < 4; oi++) {
      const radio = document.getElementById(`r-${ei}-${qi}-${oi}`);
      if (radio) radio.disabled = true;
    }

    if (picked === correct) {
      score++;
      card.classList.add('correct');
      resultDiv.className = 'result-icon correct';
      resultDiv.textContent = '✓ Correct!';
      // Highlight correct
      document.getElementById(`lbl-${ei}-${qi}-${correct}`).classList.add('is-correct');
    } else {
      card.classList.add('wrong');
      resultDiv.className = 'result-icon wrong';
      resultDiv.textContent = `✗ Incorrect — correct answer: ${LETTERS[correct]}) ${escapeHtml(exam.questions[qi].options[correct])}`;
      // Highlight wrong pick in red
      document.getElementById(`lbl-${ei}-${qi}-${picked}`).classList.add('is-wrong-pick');
      // Highlight correct in green
      document.getElementById(`lbl-${ei}-${qi}-${correct}`).classList.add('is-correct');
      // Dim others
      for (let oi = 0; oi < 4; oi++) {
        if (oi !== picked && oi !== correct) {
          document.getElementById(`lbl-${ei}-${qi}-${oi}`).classList.add('dimmed');
        }
      }
    }
  }

  // Show score banner
  const pct = Math.round(score / n * 100);
  document.getElementById(`score-num-${ei}`).textContent = `${score} / ${n}`;
  document.getElementById(`score-pct-${ei}`).textContent = `${pct}%`;
  const banner = document.getElementById(`score-${ei}`);
  banner.classList.add('visible');
  banner.style.borderLeftColor = pct >= 70 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';

  // Update tab badge
  const tab = document.querySelectorAll('.tab')[ei];
  tab.classList.add('scored');
  tab.querySelector('.badge').textContent = `${pct}%`;

  // Hide submit button
  document.getElementById(`submit-${ei}`).style.display = 'none';

  // Scroll to score banner
  banner.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function retake(ei) {
  const exam = EXAMS[ei];
  const n = exam.questions.length;

  for (let qi = 0; qi < n; qi++) {
    const card = document.getElementById(`card-${ei}-${qi}`);
    card.className = 'question-card';
    const resultDiv = document.getElementById(`result-${ei}-${qi}`);
    resultDiv.className = 'result-icon';
    resultDiv.textContent = '';

    for (let oi = 0; oi < 4; oi++) {
      const radio = document.getElementById(`r-${ei}-${qi}-${oi}`);
      if (radio) { radio.disabled = false; radio.checked = false; }
      const lbl = document.getElementById(`lbl-${ei}-${qi}-${oi}`);
      if (lbl) lbl.className = 'option-label';
    }
  }

  document.getElementById(`score-${ei}`).classList.remove('visible');
  const submitBtn = document.getElementById(`submit-${ei}`);
  submitBtn.style.display = '';
  document.getElementById(`warn-${ei}`).classList.remove('visible');

  const tab = document.querySelectorAll('.tab')[ei];
  tab.classList.remove('scored');
  tab.querySelector('.badge').textContent = '—';

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildUI();
</script>
</body>
</html>
