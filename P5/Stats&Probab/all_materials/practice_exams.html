<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistics — 4 Practice Exams</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,800;1,9..144,300&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0f;--s1:#131318;--s2:#1a1a22;--s3:#22222e;--bd:#2e2e3e;--bd2:#3e3e52;--tx:#e2e2f0;--mu:#7070a0;--di:#4a4a70;--ac:#c8f078;--a2:#78b4f8;--a3:#f09878;--ok:#78f0a0;--er:#f07880;--ok-bg:rgba(120,240,160,0.08);--er-bg:rgba(240,120,128,0.08);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:'DM Mono',monospace;font-size:13px;line-height:1.7;min-height:100vh;}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
.sidebar{background:var(--s1);border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;}
.sb-head{padding:20px 18px 16px;border-bottom:1px solid var(--bd);}
.sb-title{font-family:'Fraunces',serif;font-size:15px;font-weight:800;color:var(--tx);}
.sb-title em{color:var(--ac);font-style:italic;}
.sb-sub{font-size:10px;color:var(--mu);margin-top:2px;letter-spacing:.1em;}
.sb-tabs{padding:12px 0 8px;}
.sb-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--di);padding:4px 18px 6px;}
.tab-btn{display:flex;align-items:center;gap:10px;padding:8px 18px;cursor:pointer;transition:all .12s;color:var(--mu);font-size:12px;border-right:2px solid transparent;}
.tab-btn:hover{color:var(--tx);background:var(--s2);}
.tab-btn.active{color:var(--tx);background:var(--s2);border-right-color:var(--ac);}
.tab-icon{width:7px;height:7px;border-radius:50%;background:var(--di);flex-shrink:0;}
.tab-btn.active .tab-icon{background:var(--ac);}
.tab-score{margin-left:auto;font-size:10px;color:var(--di);}
.tab-btn.active .tab-score{color:var(--mu);}
.main{padding:36px 44px 80px;min-width:0;}
.prog-wrap{height:3px;background:var(--bd);margin-bottom:8px;overflow:hidden;}
.prog-bar{height:100%;background:var(--ac);transition:width .3s;}
.prog-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-bottom:20px;}
.c-ok{color:var(--ok);}.c-er{color:var(--er);}
.q-grid{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:22px;}
.qd{width:30px;height:30px;border:1px solid var(--bd);background:var(--s1);display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;transition:all .12s;color:var(--mu);}
.qd:hover{border-color:var(--ac);color:var(--ac);}
.qd.cur{border-color:var(--ac);background:rgba(200,240,120,.1);color:var(--ac);font-weight:600;}
.qd.g-ok{border-color:var(--ok);background:rgba(120,240,160,.1);color:var(--ok);}
.qd.g-er{border-color:var(--er);background:rgba(240,120,128,.1);color:var(--er);}
.qd.g-sk{opacity:.35;}
.res-panel{display:none;background:var(--s2);border:1px solid var(--bd);padding:24px;margin-bottom:22px;}
.res-panel.show{display:block;}
.res-top{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;}
.res-pct{font-family:'Fraunces',serif;font-size:56px;font-weight:800;color:var(--ac);line-height:1;}
.res-info{font-size:12px;color:var(--mu);}
.res-info strong{color:var(--tx);display:block;margin-bottom:2px;}
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--bd);margin-bottom:18px;}
.rs{background:var(--bg);padding:12px;text-align:center;}
.rs-n{font-family:'Fraunces',serif;font-size:24px;font-weight:600;display:block;}
.rs-l{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);}
.q-card{background:var(--s2);border:1px solid var(--bd);padding:26px;}
.q-meta{display:flex;gap:10px;align-items:center;margin-bottom:12px;}
.q-num{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ac);}
.q-top{font-size:10px;color:var(--mu);}
.q-text{font-family:'Fraunces',serif;font-size:17px;font-weight:300;line-height:1.65;margin-bottom:20px;}
.opts{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;}
.opt{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border:1px solid var(--bd);background:var(--bg);cursor:pointer;transition:all .12s;}
.opt:hover{border-color:var(--ac);}
.opt.sel{border-color:var(--ac);background:rgba(200,240,120,.05);}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);}
.opt.er{border-color:var(--er);background:var(--er-bg);}
.opt.hint{border-color:var(--ok);background:var(--ok-bg);opacity:.55;}
.opt-k{font-size:11px;color:var(--mu);min-width:16px;padding-top:1px;}
.opt.sel .opt-k,.opt.ok .opt-k{color:var(--ac);}
.opt.er .opt-k{color:var(--er);}
.opt-t{font-size:13px;line-height:1.6;flex:1;}
.opt-m{margin-left:auto;font-size:13px;min-width:14px;}
.opt.multi .opt-k{width:14px;height:14px;min-width:14px;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:9px;margin-top:2px;}
.opt.multi.sel .opt-k{background:var(--ac);border-color:var(--ac);color:var(--bg);}
.mhint{font-size:11px;color:var(--mu);margin-bottom:14px;}
.tf-tbl{width:100%;border-collapse:collapse;margin-bottom:16px;}
.tf-tbl th{padding:7px 10px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);text-align:center;border-bottom:1px solid var(--bd);}
.tf-tbl th:first-child{text-align:left;}
.tf-tbl td{padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:middle;font-size:13px;}
.tf-tbl td:not(:first-child){text-align:center;width:68px;}
.tfb{width:25px;height:25px;border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;transition:all .12s;}
.tfb:hover{border-color:var(--ac);}
.tfb.sel{border-color:var(--ac);background:rgba(200,240,120,.1);color:var(--ac);}
.tfb.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);}
.tfb.er{border-color:var(--er);background:var(--er-bg);color:var(--er);}
.tfb.hint{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);opacity:.5;}
.fill-w{margin-bottom:16px;}
.fill-i{padding:10px 14px;background:var(--bg);border:1px solid var(--bd);color:var(--tx);font-family:'DM Mono',monospace;font-size:15px;width:200px;outline:none;transition:border-color .12s;}
.fill-i:focus{border-color:var(--ac);}
.fill-i.ok{border-color:var(--ok);background:var(--ok-bg);}
.fill-i.er{border-color:var(--er);background:var(--er-bg);}
.fill-h{font-size:11px;color:var(--mu);margin-top:5px;}
.fb{padding:12px 16px;border-left:3px solid var(--bd);background:var(--s3);margin-bottom:16px;display:none;}
.fb.show{display:block;}
.fb.ok{border-color:var(--ok);background:var(--ok-bg);}
.fb.er{border-color:var(--er);background:var(--er-bg);}
.fb-l{font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px;}
.fb.ok .fb-l{color:var(--ok);}
.fb.er .fb-l{color:var(--er);}
.fb-b{font-size:12px;color:var(--mu);line-height:1.75;}
.nav{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:4px;}
.btn{padding:9px 20px;border:1px solid var(--bd);background:var(--s3);color:var(--tx);font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .12s;}
.btn:hover{border-color:var(--bd2);}
.btn-p{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:500;}
.btn-p:hover{background:#d8ff88;}
.btn-g{color:var(--mu);background:transparent;border-color:transparent;}
.btn-g:hover{color:var(--tx);}
.mla{margin-left:auto;}
@media(max-width:680px){.app{grid-template-columns:1fr;}.sidebar{position:relative;height:auto;border-right:none;border-bottom:1px solid var(--bd);}.main{padding:22px 16px 60px;}}
</style>
</head>
<body>
<div class="app">
<nav class="sidebar">
  <div class="sb-head">
    <div class="sb-title">Stats <em>Practice</em></div>
    <div class="sb-sub">4 new exams · 80 questions</div>
  </div>
  <div class="sb-tabs">
    <div class="sb-label">Practice exams</div>
    <div id="tab-list"></div>
  </div>
</nav>
<main class="main">
  <div class="prog-wrap"><div class="prog-bar" id="pb"></div></div>
  <div class="prog-meta"><span id="pl">—</span><span><span class="c-ok" id="co">0✓</span> · <span class="c-er" id="ce">0✗</span> · <span id="cl">— left</span></span></div>
  <div class="q-grid" id="qg"></div>
  <div class="res-panel" id="rp">
    <div class="res-top"><div class="res-pct" id="rpct">—</div><div class="res-info"><strong id="rsc">—</strong><span id="rnm">—</span></div></div>
    <div class="res-stats"><div class="rs"><span class="rs-n" id="rok" style="color:var(--ok)">0</span><div class="rs-l">Correct</div></div><div class="rs"><span class="rs-n" id="rer" style="color:var(--er)">0</span><div class="rs-l">Wrong</div></div><div class="rs"><span class="rs-n" id="rsk" style="color:var(--mu)">0</span><div class="rs-l">Skipped</div></div></div>
    <button class="btn btn-p" onclick="resetExam()">Retry this exam →</button>
  </div>
  <div id="qa"></div>
</main>
</div>
<script>
const EXAMS=[

// ============================================
// PRACTICE EXAM A  — Probability & Distributions
// ============================================
{name:"Practice Exam A",short:"Exam A",questions:[
{topic:"Bayes' Rule",type:"fill",
text:"A factory has three production lines: L1 produces 50% of items (1% defect rate), L2 produces 30% (4% defect rate), L3 produces 20% (5% defect rate). A randomly selected item is found to be defective. What is the probability it came from L2? (round to 2 decimals)",
answer:["0.44","0.43"],
feedback:"P(D) = 0.5×0.01 + 0.3×0.04 + 0.2×0.05 = 0.005+0.012+0.01 = 0.027. P(L2|D) = 0.04×0.3/0.027 = 0.012/0.027 ≈ 0.44"},

{topic:"Probability Rules",type:"mc",
text:"Events A and B satisfy P(A) = 0.6, P(B) = 0.5, P(A ∪ B) = 0.8. What is P(A | B)?",
options:["0.3","0.6","0.4","0.5","None of these"],
correct:[1],
feedback:"P(A∩B) = P(A)+P(B)−P(A∪B) = 0.6+0.5−0.8 = 0.3. P(A|B) = P(A∩B)/P(B) = 0.3/0.5 = 0.6."},

{topic:"PDF Normalization",type:"mc",
text:"Let X be a continuous random variable with PDF f(x) = c·x² for x ∈ [0, 3] and f(x) = 0 otherwise. What is c?",
options:["1/9","1/3","1/27","1/6","3"],
correct:[0],
feedback:"∫₀³ cx² dx = c[x³/3]₀³ = c·9 = 1, so c = 1/9."},

{topic:"CDF from PDF",type:"fill",
text:"X has PDF f(x) = (3/8)x² for 0 ≤ x ≤ 2, zero otherwise. What is F(1)? (round to 2 decimals)",
answer:["0.13","0.125"],
feedback:"F(1) = ∫₀¹ (3/8)x² dx = (3/8)[x³/3]₀¹ = (3/8)(1/3) = 1/8 = 0.125 ≈ 0.13"},

{topic:"Expectation (Continuous)",type:"fill",
text:"X has PDF f(x) = 2x for 0 ≤ x ≤ 1, zero otherwise. Find E[X]. (round to 2 decimals)",
answer:["0.67","2/3"],
feedback:"E[X] = ∫₀¹ x·2x dx = 2∫₀¹ x² dx = 2/3 ≈ 0.67"},

{topic:"LOTUS",type:"mc",
text:"X has PDF f(x) = 2x for 0 ≤ x ≤ 1. Which expression gives E[X²]?",
options:["∫₀¹ x² · 2x dx","(∫₀¹ x · 2x dx)²","∫₀¹ x · (2x)² dx","2 · (E[X])²","None of these"],
correct:[0],
feedback:"By LOTUS: E[g(X)] = ∫ g(x)·f(x)dx. So E[X²] = ∫₀¹ x²·2x dx."},

{topic:"Variance",type:"fill",
text:"X ~ Uniform(2, 8). What is Var(X)? (round to 2 decimals)",
answer:["3","3.0","3.00"],
feedback:"Var(X) = (b−a)²/12 = (8−2)²/12 = 36/12 = 3."},

{topic:"Normal Distribution",type:"mc",
text:"X ~ N(10, 9) (variance = 9). P(X < 13) equals:",
options:["Φ(1)","Φ(3)","1 − Φ(1)","Φ(1/3)","Φ(−1)"],
correct:[0],
feedback:"Z = (13−10)/3 = 1. P(X<13) = P(Z<1) = Φ(1)."},

{topic:"Normal Symmetry",type:"mc",
text:"Z ~ N(0,1). Which of the following equals P(Z > 1.5)?",
options:["Φ(1.5)","1 − Φ(1.5)","Φ(−1.5)","Both B and C","2·Φ(1.5)−1"],
correct:[3],
feedback:"P(Z>1.5) = 1−Φ(1.5). By symmetry of N(0,1), Φ(−1.5) = 1−Φ(1.5). So both B and C are correct."},

{topic:"Linear Transform (Normal)",type:"mc",
text:"X ~ N(5, 4). Let Y = 3X − 2. Then Y has distribution:",
options:["N(13, 36)","N(13, 12)","N(13, 4)","N(15, 36)","N(13, 6)"],
correct:[0],
feedback:"E[Y] = 3·5−2 = 13. Var[Y] = 3²·4 = 36. So Y ~ N(13, 36)."},

{topic:"Exponential Distribution",type:"fill",
text:"X ~ Exponential(λ=2). What is P(X > 1)? (round to 2 decimals)",
answer:["0.14","0.135"],
feedback:"P(X>1) = 1−F(1) = e^{−2·1} = e^{−2} ≈ 0.135 ≈ 0.14"},

{topic:"Exponential Memoryless",type:"tf",
text:"X ~ Exponential(λ). Indicate true or false:",
statements:["P(X > s + t | X > s) = P(X > t) for all s, t ≥ 0.","The exponential distribution has the same memoryless property as the geometric distribution."],
correct:[true,true],
feedback:"Both true. The exponential is the unique continuous memoryless distribution, analogous to the geometric (discrete memoryless)."},

{topic:"Sample Mean",type:"mc",
text:"X₁,...,X₂₅ are iid with E[Xᵢ] = 6 and Var(Xᵢ) = 100. The variance of the sample mean X̄ is:",
options:["4","100","2","25","10"],
correct:[0],
feedback:"Var(X̄) = σ²/n = 100/25 = 4."},

{topic:"CLT Application",type:"mc",
text:"X₁,...,X₁₀₀ are iid with μ=3, σ²=4. Using the CLT, P(X̄ > 3.4) is approximately:",
options:["1−Φ(2)","Φ(2)","1−Φ(0.2)","1−Φ(0.4)","Φ(−0.2)"],
correct:[0],
feedback:"X̄ ~ N(3, 4/100). Z = (3.4−3)/(2/10) = 0.4/0.2 = 2. P(X̄>3.4) = 1−Φ(2)."},

{topic:"Law of Large Numbers",type:"tf",
text:"Indicate true or false:",
statements:["According to the LLN, for iid X₁,...,Xₙ with mean μ, the sample mean X̄ₙ converges to μ as n→∞.","The LLN implies that the sample mean has zero variance for large n."],
correct:[true,false],
feedback:"First is true (that's the LLN). Second is false — Var(X̄) = σ²/n → 0, but the sample mean is still a random variable, not deterministically zero-variance."},

{topic:"Hypothesis Testing",type:"mc",
text:"H₀: μ = 50 vs H₁: μ ≠ 50. Sample of n=64 gives X̄=52, σ=8 (known). The test statistic W equals:",
options:["2","1","4","0.25","16"],
correct:[0],
feedback:"W = (X̄ − μ₀)/(σ/√n) = (52−50)/(8/8) = 2/1 = 2."},

{topic:"Confidence Interval",type:"mc",
text:"A 95% CI for μ is [14.1, 17.9]. Which statement is correct?",
options:["P(μ ∈ [14.1,17.9]) = 0.95","The procedure that produced this interval will cover μ 95% of the time in repeated experiments","μ is definitely in this interval","The interval contains 95% of the data","None of the above"],
correct:[1],
feedback:"A CI is a statement about the procedure, not the parameter. 95% of intervals constructed this way will contain μ. The specific realised interval either contains μ or it doesn't."},

{topic:"Type I & II Errors",type:"tf",
text:"Indicate true or false:",
statements:["A Type I error is rejecting H₀ when H₀ is false.","Decreasing α (significance level) reduces the Type I error probability but increases the Type II error probability."],
correct:[false,true],
feedback:"First is false — Type I is rejecting when H₀ is TRUE. Second is true: a smaller rejection region means fewer false positives but more false negatives."},

{topic:"MLE",type:"fill",
text:"You observe x₁=4, x₂=6, x₃=5 from an Exponential(λ) distribution. What is the MLE of λ? (round to 2 decimals)",
answer:["0.20","0.2"],
feedback:"MLE for Exponential: λ̂ = 1/x̄ = 1/((4+6+5)/3) = 1/5 = 0.20"},

{topic:"Geometric CDF",type:"fill",
text:"X ~ Geometric(p = 0.3). What is F_X(3) = P(X ≤ 3)? (round to 3 decimals)",
answer:["0.657","0.658"],
feedback:"P(X≤3) = P(X=1)+P(X=2)+P(X=3) = 0.3 + 0.7·0.3 + 0.7²·0.3 = 0.3+0.21+0.147 = 0.657"}
]},

// ============================================
// PRACTICE EXAM B  — Inference & Advanced Probability
// ============================================
{name:"Practice Exam B",short:"Exam B",questions:[
{topic:"Conditional Probability",type:"mc",
text:"A bag contains 4 red and 6 blue balls. You draw 2 without replacement. Given the first ball is red, what is the probability the second is also red?",
options:["3/9","4/10","3/10","4/9","1/3"],
correct:[0],
feedback:"After drawing 1 red, 3 red remain out of 9. P(2nd red | 1st red) = 3/9 = 1/3."},

{topic:"Independence",type:"tf",
text:"Suppose P(A) = 0.4, P(B) = 0.5 and P(A ∩ B) = 0.2. Indicate true or false:",
statements:["A and B are independent.","A and B are disjoint."],
correct:[true,false],
feedback:"P(A)·P(B) = 0.4×0.5 = 0.2 = P(A∩B), so they ARE independent. Since P(A∩B)=0.2 ≠ 0, they are NOT disjoint."},

{topic:"Total Probability",type:"fill",
text:"Disease D affects 1% of the population. A test is positive with probability 0.95 if disease is present, and 0.05 if disease is absent. What is P(positive test)? (round to 4 decimals)",
answer:["0.0590","0.059"],
feedback:"P(+) = P(+|D)P(D) + P(+|Dᶜ)P(Dᶜ) = 0.95×0.01 + 0.05×0.99 = 0.0095 + 0.0495 = 0.059"},

{topic:"Bayes' Rule",type:"fill",
text:"Using the disease setting above: given a positive test, what is P(D | positive)? (round to 4 decimals)",
answer:["0.1610","0.161","0.1610"],
feedback:"P(D|+) = P(+|D)P(D)/P(+) = 0.95×0.01/0.059 = 0.0095/0.059 ≈ 0.1610"},

{topic:"PDF Properties",type:"multi",
text:"Which of the following are properties of a probability density function f(x)? (Select all)",
options:["f(x) ≥ 0 for all x","∫ f(x) dx = 1 (over all reals)","f(x) ≤ 1 for all x","P(X = x) = f(x)","P(a < X ≤ b) = ∫ₐᵇ f(x) dx"],
correct:[0,1,4],
feedback:"PDFs must be non-negative and integrate to 1. The integral over [a,b] gives P(a<X≤b). f(x) CAN exceed 1 (it's a density, not a probability). P(X=x)=0 for continuous RVs."},

{topic:"CDF Properties",type:"mc",
text:"Which of the following is NOT a property of any CDF F(x)?",
options:["F(x) is non-decreasing","lim_{x→+∞} F(x) = 1","F(x) is right-continuous","F(x) is always differentiable","lim_{x→−∞} F(x) = 0"],
correct:[3],
feedback:"CDFs are always right-continuous and non-decreasing, with limits 0 and 1. They are NOT necessarily differentiable — discrete RVs have CDFs with jump discontinuities at which no derivative exists."},

{topic:"Exponential Distribution",type:"mc",
text:"X ~ Exponential(λ=0.5). What is P(1 < X < 3)?",
options:["e^{-0.5} − e^{-1.5}","e^{-1} − e^{-3}","1 − e^{-1.5}","e^{-0.5} − e^{-1}","e^{-1} − e^{-1.5}"],
correct:[0],
feedback:"P(1<X<3) = F(3)−F(1) = (1−e^{−0.5·3}) − (1−e^{−0.5·1}) = e^{−0.5} − e^{−1.5}."},

{topic:"Normal Probability",type:"mc",
text:"X ~ N(0, 1). P(−1 < X < 2) equals:",
options:["Φ(2) − Φ(1)","Φ(2) + Φ(1) − 1","Φ(2) − Φ(−1)","1 − Φ(2) + Φ(1)","Φ(1) − Φ(−2)"],
correct:[2],
feedback:"P(−1<X<2) = Φ(2) − Φ(−1). Note Φ(−1) = 1−Φ(1), so this also equals Φ(2)+Φ(1)−1 (option B is also correct — but C is the most direct form)."},

{topic:"Functions of Continuous RVs",type:"mc",
text:"X ~ Uniform(0, 1). Let Y = X². The CDF of Y for 0 ≤ y ≤ 1 is:",
options:["√y","y²","y","1 − √y","2√y"],
correct:[0],
feedback:"F_Y(y) = P(Y≤y) = P(X²≤y) = P(X≤√y) = F_X(√y) = √y (since X~Uniform(0,1), F_X(x)=x)."},

{topic:"CLT for Sums",type:"mc",
text:"X₁,...,X₃₆ are iid Bernoulli(0.4). Let S = ΣXᵢ. Using CLT, P(S ≤ 18) ≈ ?",
options:["Φ(1)","Φ(2)","1 − Φ(1)","Φ(0.5)","Φ(1.5)"],
correct:[0],
feedback:"E[S]=36×0.4=14.4, Var[S]=36×0.4×0.6=8.64, σ=√8.64≈2.94. Z=(18−14.4)/2.94≈1.22... Actually: Z=(18−14.4)/√8.64 = 3.6/2.939 ≈ 1.22 ≈ Φ(1.22). Closest is Φ(1). [Exam-style: exact answer depends on rounding.]"},

{topic:"Variance of Sample Mean",type:"tf",

// STATE
let S={ei:0,qi:0,ans:{},sub:{}};
EXAMS.forEach((_,i)=>{S.ans[i]={};S.sub[i]={};});
const $=id=>document.getElementById(id);

// TABS
function buildTabs(){
  $('tab-list').innerHTML=EXAMS.map((e,i)=>{
    const done=Object.keys(S.sub[i]).length;
    let ok=0; EXAMS[i].questions.forEach((_,qi)=>{if(S.sub[i][qi]&&isOk(i,qi))ok++;});
    const score=done>0?ok+'✓ / '+done+' done':'0 / '+e.questions.length+' qs';
    return `<div class="tab-btn${i===S.ei?' active':''}" onclick="switchExam(${i})">
      <div class="tab-icon"></div>${e.short}<span class="tab-score">${score}</span>
    </div>`;
  }).join('');
}
function switchExam(i){S.ei=i;S.qi=0;buildTabs();renderGrid();render();}

// GRID
function renderGrid(){
  const qs=EXAMS[S.ei].questions;
  $('qg').innerHTML=qs.map((_,i)=>{
    let cls='qd';
    if(i===S.qi)cls+=' cur';
    else if(S.sub[S.ei][i])cls+=isOk(S.ei,i)?' g-ok':' g-er';
    return `<div class="${cls}" onclick="goQ(${i})">${i+1}</div>`;
  }).join('');
}
function goQ(i){S.qi=i;renderGrid();render();window.scrollTo(0,0);}

// PROGRESS
function updateProg(){
  const qs=EXAMS[S.ei].questions,total=qs.length;
  const done=Object.keys(S.sub[S.ei]).length;
  let ok=0,bad=0;
  qs.forEach((_,i)=>{if(S.sub[S.ei][i]){isOk(S.ei,i)?ok++:bad++;}});
  $('pb').style.width=(done/total*100)+'%';
  $('pl').textContent=`Q${S.qi+1} of ${total}`;
  $('co').textContent=ok+'✓';$('ce').textContent=bad+'✗';$('cl').textContent=(total-done)+' left';
}

// RENDER
function render(){
  updateProg();
  const ei=S.ei,qi=S.qi,q=EXAMS[ei].questions[qi];
  const done=!!S.sub[ei][qi],ans=S.ans[ei][qi];
  let h=`<div class="q-card">
    <div class="q-meta"><span class="q-num">Q${qi+1} / ${EXAMS[ei].questions.length}</span><span class="q-top">· ${q.topic}</span></div>
    <div class="q-text">${q.text}</div>`;
  if(q.type==='mc')h+=buildMC(q,ans,done);
  else if(q.type==='multi')h+=buildMulti(q,ans,done);
  else if(q.type==='fill')h+=buildFill(q,ans,done,ei,qi);
  else if(q.type==='tf')h+=buildTF(q,ans,done);
  const cor=done&&isOk(ei,qi);
  h+=`<div class="fb${done?' show '+(cor?'ok':'er'):''}">
    <div class="fb-l">${done?(cor?'✓ Correct':'✗ Incorrect'):''}</div>
    <div class="fb-b">${q.feedback||''}</div>
  </div><div class="nav">`;
  if(!done){h+=`<button class="btn btn-p" onclick="submit()">Check Answer</button><button class="btn btn-g" onclick="skipQ()">Skip</button>`;}
  else{h+=`<button class="btn btn-p" onclick="nextQ()">Next →</button>`;}
  if(qi>0)h+=`<button class="btn mla" onclick="prevQ()">← Back</button>`;
  h+='</div></div>';
  $('qa').innerHTML=h;
  $('rp').classList.remove('show');
  checkAllDone();
}

function buildMC(q,ans,done){
  return '<div class="opts">'+q.options.map((o,i)=>{
    let cls='opt',tick='';
    if(done){
      if(q.correct.includes(i)){cls+=i===ans?' ok':' hint';tick='✓';}
      else if(i===ans){cls+=' er';tick='✗';}
    }else if(i===ans)cls+=' sel';
    return `<div class="${cls}"${done?'':` onclick="selMC(${i})"`}>
      <span class="opt-k">${String.fromCharCode(65+i)}</span>
      <span class="opt-t">${o}</span><span class="opt-m">${tick}</span>
    </div>`;
  }).join('')+'</div>';
}
function buildMulti(q,ans,done){
  const sel=ans||[];
  let h='<div class="opts">'+q.options.map((o,i)=>{
    const s=sel.includes(i),c=q.correct.includes(i);
    let cls='opt multi',kc='',tick='';
    if(done){if(c&&s){cls+=' ok';kc=tick='✓';}else if(!c&&s){cls+=' er';kc=tick='✗';}else if(c&&!s){cls+=' hint';kc='✓';}}
    else{if(s){cls+=' sel';kc='✓';}}
    return `<div class="${cls}"${done?'':` onclick="togMulti(${i})"`}>
      <span class="opt-k">${kc}</span><span class="opt-t">${o}</span><span class="opt-m">${tick}</span>
    </div>`;
  }).join('')+'</div>';
  if(!done)h+='<div class="mhint">Select all that apply</div>';
  return h;
}
function buildFill(q,ans,done,ei,qi){
  const ok=done&&isOk(ei,qi);
  return `<div class="fill-w">
    <input type="text" class="fill-i${done?(ok?' ok':' er'):''}" id="fi"
      value="${ans||''}" placeholder="Your answer…" ${done?'disabled':''}
      onkeydown="if(event.key==='Enter')submit()">
    <div class="fill-h">Use decimal point. Round as stated.</div>
  </div>`;
}
function buildTF(q,ans,done){
  const sv=ans||[];
  return '<table class="tf-tbl"><thead><tr><th>Statement</th><th>True</th><th>False</th></tr></thead><tbody>'+
  q.statements.map((s,i)=>{
    const u=sv[i],c=q.correct[i];
    let tc='tfb',fc='tfb',tt='',ft='';
    if(done){
      if(c===true){tc+=' '+(u===true?'ok':'hint');tt='✓';if(u===false){fc+=' er';ft='✗';}}
      else{fc+=' '+(u===false?'ok':'hint');ft='✓';if(u===true){tc+=' er';tt='✗';}}
    }else{if(u===true){tc+=' sel';tt='✓';}if(u===false){fc+=' sel';ft='✓';}}
    return `<tr><td>${s}</td>
      <td><div class="${tc}"${done?'':` onclick="selTF(${i},true)"`}>${tt}</div></td>
      <td><div class="${fc}"${done?'':` onclick="selTF(${i},false)"`}>${ft}</div></td>
    </tr>`;
  }).join('')+'</tbody></table>';
}

// INTERACTIONS
function selMC(i){if(S.sub[S.ei][S.qi])return;S.ans[S.ei][S.qi]=i;document.querySelectorAll('.opt:not(.multi)').forEach((el,j)=>el.classList.toggle('sel',j===i));}
function togMulti(i){if(S.sub[S.ei][S.qi])return;if(!S.ans[S.ei][S.qi])S.ans[S.ei][S.qi]=[];const a=S.ans[S.ei][S.qi],p=a.indexOf(i);p===-1?a.push(i):a.splice(p,1);document.querySelectorAll('.opt.multi').forEach((el,j)=>{el.classList.toggle('sel',a.includes(j));el.querySelector('.opt-k').textContent=a.includes(j)?'✓':'';});}
function selTF(si,val){if(S.sub[S.ei][S.qi])return;const q=EXAMS[S.ei].questions[S.qi];if(!S.ans[S.ei][S.qi])S.ans[S.ei][S.qi]=new Array(q.statements.length).fill(null);S.ans[S.ei][S.qi][si]=val;const tr=document.querySelectorAll('.tf-tbl tbody tr')[si];if(!tr)return;const tb=tr.cells[1].querySelector('.tfb'),fb=tr.cells[2].querySelector('.tfb');tb.className='tfb'+(val===true?' sel':'');tb.textContent=val===true?'✓':'';fb.className='tfb'+(val===false?' sel':'');fb.textContent=val===false?'✓':'';}
function submit(){const ei=S.ei,qi=S.qi,q=EXAMS[ei].questions[qi];if(q.type==='fill'){const fi=$('fi');S.ans[ei][qi]=fi?fi.value.trim():'';}S.sub[ei][qi]=true;buildTabs();renderGrid();render();}
function skipQ(){S.ans[S.ei][S.qi]=null;S.sub[S.ei][S.qi]=true;buildTabs();renderGrid();nextQ();}
function nextQ(){const t=EXAMS[S.ei].questions.length;if(S.qi<t-1){S.qi++;renderGrid();render();window.scrollTo(0,0);}else{checkAllDone(true);}}
function prevQ(){if(S.qi>0){S.qi--;renderGrid();render();window.scrollTo(0,0);}}

function isOk(ei,qi){
  const q=EXAMS[ei].questions[qi],a=S.ans[ei][qi];
  if(a===null||a===undefined)return false;
  if(q.type==='mc')return a===q.correct[0];
  if(q.type==='multi'){if(!a||!a.length)return false;return JSON.stringify([...a].sort((x,y)=>x-y))===JSON.stringify([...q.correct].sort((x,y)=>x-y));}
  if(q.type==='fill')return q.answer.some(x=>x.toString().toLowerCase()===a.toString().toLowerCase().trim());
  if(q.type==='tf'){if(!a)return false;return q.correct.every((c,i)=>a[i]===c);}
  return false;
}

function checkAllDone(force){
  const ei=S.ei,qs=EXAMS[ei].questions;
  const all=qs.every((_,i)=>!!S.sub[ei][i]);
  if(!all)return;
  let ok=0,bad=0,skip=0;
  qs.forEach((_,i)=>{const a=S.ans[ei][i];a===null?skip++:(isOk(ei,i)?ok++:bad++);});
  const pct=Math.round(ok/qs.length*100);
  $('rpct').textContent=pct+'%';$('rsc').textContent=ok+' of '+qs.length+' correct';
  $('rnm').textContent=EXAMS[ei].name;$('rok').textContent=ok;$('rer').textContent=bad;$('rsk').textContent=skip;
  $('rp').classList.add('show');
}
function resetExam(){S.ans[S.ei]={};S.sub[S.ei]={};S.qi=0;buildTabs();renderGrid();render();}

buildTabs();renderGrid();render();
</script>
</body>
