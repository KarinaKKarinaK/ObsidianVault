// ─── LAYOUT ──────────────────────────────────────────────────────────────────

const NODE_W = 168;
const NODE_H_BASE = 42;
const H_GAP = 52;   // horizontal gap between levels
const V_GAP = 14;   // vertical gap between sibling nodes

function measureNodeHeight(node) {
  // Estimate wrapped text height
  const charsPerLine = 20;
  const lines = Math.ceil(node.label.length / charsPerLine);
  return Math.max(NODE_H_BASE, 28 + lines * 16);
}

function getVisibleChildren(node) {
  if (!node.children || !node.expanded) return [];
  return node.children;
}

function subtreeHeight(node) {
  const children = getVisibleChildren(node);
  if (children.length === 0) return measureNodeHeight(node);
  const childrenH = children.reduce((s, c) => s + subtreeHeight(c), 0)
                  + (children.length - 1) * V_GAP;
  return Math.max(measureNodeHeight(node), childrenH);
}

function layoutTree(node, x, y) {
  const h = measureNodeHeight(node);
  node._x = x;
  node._y = y;
  node._w = NODE_W;
  node._h = h;

  const children = getVisibleChildren(node);
  if (children.length === 0) return;

  const totalH = children.reduce((s, c) => s + subtreeHeight(c), 0)
               + (children.length - 1) * V_GAP;
  let childY = y - totalH / 2;
  const childX = x + NODE_W + H_GAP;

  for (const child of children) {
    const ch = subtreeHeight(child);
    layoutTree(child, childX, childY + ch / 2);
    childY += ch + V_GAP;
  }
}

function collectNodes(node, arr = []) {
  arr.push(node);
  const children = getVisibleChildren(node);
  for (const c of children) collectNodes(c, arr);
  return arr;
}

function collectEdges(node, arr = []) {
  const children = getVisibleChildren(node);
  for (const c of children) {
    arr.push({ parent: node, child: c });
    collectEdges(c, arr);
  }
  return arr;
}

// ─── RENDERING ───────────────────────────────────────────────────────────────

const svg = document.getElementById('mindmap');
const rootG = document.getElementById('root-g');

let transform = { x: 80, y: 0, scale: 1 };
let searchTerm = '';

function colorScheme(colorKey) {
  return COLORS[colorKey] || COLORS.root;
}

function makePath(p, c) {
  const px = p._x + p._w;
  const py = p._y + p._h / 2;
  const cx = c._x;
  const cy = c._y + c._h / 2;
  const mx = (px + cx) / 2;
  return `M ${px} ${py} C ${mx} ${py}, ${mx} ${cy}, ${cx} ${cy}`;
}

function wrapText(text, maxWidth, fontSize) {
  // Simple word-wrap for SVG
  const words = text.split(' ');
  const lines = [];
  let line = '';
  const approxCharW = fontSize * 0.55;
  const maxChars = Math.floor(maxWidth / approxCharW);
  for (const w of words) {
    if ((line + ' ' + w).trim().length > maxChars && line) {
      lines.push(line);
      line = w;
    } else {
      line = line ? line + ' ' + w : w;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function render() {
  // Layout
  const svgRect = svg.getBoundingClientRect();
  const centerY = (svgRect.height - 52) / 2 / transform.scale;
  layoutTree(treeData, 0, centerY);

  const nodes = collectNodes(treeData);
  const edges = collectEdges(treeData);

  rootG.innerHTML = '';
  rootG.setAttribute('transform', `translate(${transform.x},${transform.y}) scale(${transform.scale})`);

  // Draw edges first
  const edgeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  edgeG.setAttribute('class', 'edges');
  for (const e of edges) {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', makePath(e.parent, e.child));
    const cs = colorScheme(e.child.color);
    path.setAttribute('stroke', cs.border);
    path.setAttribute('stroke-width', '1.8');
    path.setAttribute('fill', 'none');
    path.setAttribute('opacity', '0.55');
    edgeG.appendChild(path);
  }
  rootG.appendChild(edgeG);

  // Draw nodes
  const nodeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  nodeG.setAttribute('class', 'nodes');

  for (const node of nodes) {
    const cs = colorScheme(node.color);
    const isMatch = searchTerm && node.label.toLowerCase().includes(searchTerm.toLowerCase());
    const isRoot = node.id === 'root';
    const hasChildren = node.children && node.children.length > 0;

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'node-group');
    g.style.cursor = hasChildren ? 'pointer' : 'default';

    // Shadow rect
    const shadow = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    shadow.setAttribute('x', node._x + 2);
    shadow.setAttribute('y', node._y + 3);
    shadow.setAttribute('width', node._w);
    shadow.setAttribute('height', node._h);
    shadow.setAttribute('rx', '8');
    shadow.setAttribute('fill', 'rgba(0,0,0,0.07)');
    g.appendChild(shadow);

    // Main rect
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', node._x);
    rect.setAttribute('y', node._y);
    rect.setAttribute('width', node._w);
    rect.setAttribute('height', node._h);
    rect.setAttribute('rx', '8');
    rect.setAttribute('fill', isMatch ? '#fffacd' : cs.fill);
    rect.setAttribute('stroke', isMatch ? '#f0c000' : cs.border);
    rect.setAttribute('stroke-width', isMatch ? '2.5' : (isRoot ? '2' : '1.5'));
    g.appendChild(rect);

    // Label
    const labelLines = wrapText(node.label, NODE_W - 16, isRoot ? 13 : 11);
    const lineH = isRoot ? 16 : 14;
    const totalTextH = labelLines.length * lineH;
    const startY = node._y + node._h / 2 - totalTextH / 2 + (isRoot ? 11 : 9);

    for (let i = 0; i < labelLines.length; i++) {
      const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', node._x + NODE_W / 2);
      txt.setAttribute('y', startY + i * lineH);
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('fill', cs.text);
      txt.setAttribute('font-size', isRoot ? '13' : '11');
      txt.setAttribute('font-weight', (isRoot || node.children) ? '600' : '500');
      txt.setAttribute('font-family', isRoot ? "Georgia, 'Times New Roman', serif" : 'system-ui, sans-serif');
      txt.textContent = labelLines[i];
      g.appendChild(txt);
    }

    // Collapse/expand indicator
    if (hasChildren) {
      const ind = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      ind.setAttribute('x', node._x + NODE_W - 9);
      ind.setAttribute('y', node._y + node._h / 2 + 4);
      ind.setAttribute('text-anchor', 'middle');
      ind.setAttribute('fill', cs.border);
      ind.setAttribute('font-size', '10');
      ind.setAttribute('font-weight', '700');
      ind.textContent = node.expanded ? '−' : '+';
      g.appendChild(ind);
    }

    // Events
    g.addEventListener('click', (e) => {
      e.stopPropagation();
      if (hasChildren) {
        node.expanded = !node.expanded;
        render();
      }
    });

    g.addEventListener('mouseenter', (ev) => {
      showTooltip(ev, node);
    });
    g.addEventListener('mousemove', (ev) => {
      moveTooltip(ev);
    });
    g.addEventListener('mouseleave', () => {
      hideTooltip();
    });

    nodeG.appendChild(g);
  }

  rootG.appendChild(nodeG);
}

// ─── TOOLTIP ─────────────────────────────────────────────────────────────────

const tooltip = document.getElementById('tooltip');

function showTooltip(ev, node) {
  if (!node.desc) return;
  tooltip.innerHTML = `<strong>${node.label}</strong>${node.desc}`;
  tooltip.style.display = 'block';
  moveTooltip(ev);
}
function moveTooltip(ev) {
  let x = ev.clientX + 14;
  let y = ev.clientY + 14;
  if (x + 290 > window.innerWidth) x = ev.clientX - 294;
  if (y + 100 > window.innerHeight) y = ev.clientY - 80;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}
function hideTooltip() {
  tooltip.style.display = 'none';
}

// ─── PAN + ZOOM ───────────────────────────────────────────────────────────────

const wrap = document.getElementById('canvas-wrap');
let isPanning = false;
let panStart = { x: 0, y: 0 };
let transformStart = { x: 0, y: 0 };

wrap.addEventListener('mousedown', (e) => {
  if (e.target.closest('.node-group')) return;
  isPanning = true;
  panStart = { x: e.clientX, y: e.clientY };
  transformStart = { x: transform.x, y: transform.y };
  wrap.classList.add('grabbing');
});

window.addEventListener('mousemove', (e) => {
  if (!isPanning) return;
  transform.x = transformStart.x + (e.clientX - panStart.x);
  transform.y = transformStart.y + (e.clientY - panStart.y);
  rootG.setAttribute('transform', `translate(${transform.x},${transform.y}) scale(${transform.scale})`);
});

window.addEventListener('mouseup', () => {
  isPanning = false;
  wrap.classList.remove('grabbing');
});

wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.min(3, Math.max(0.2, transform.scale * delta));

  // Zoom toward mouse position
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  transform.x = mx - (mx - transform.x) * (newScale / transform.scale);
  transform.y = my - (my - transform.y) * (newScale / transform.scale);
  transform.scale = newScale;
  rootG.setAttribute('transform', `translate(${transform.x},${transform.y}) scale(${transform.scale})`);
}, { passive: false });

// ─── CONTROLS ─────────────────────────────────────────────────────────────────

function setAllExpanded(node, val, depth = 0) {
  if (node.children) {
    node.expanded = val;
    // For collapse-all, collapse everything; for expand-all, expand everything
    for (const c of node.children) setAllExpanded(c, val, depth + 1);
  }
}

document.getElementById('btn-expand').addEventListener('click', () => {
  setAllExpanded(treeData, true);
  render();
});

document.getElementById('btn-collapse').addEventListener('click', () => {
  // Keep root and top branches expanded, collapse sub-branches
  treeData.expanded = true;
  for (const branch of (treeData.children || [])) {
    branch.expanded = false;
    setAllExpanded(branch, false);
  }
  render();
});

document.getElementById('btn-reset').addEventListener('click', () => {
  const svgRect = svg.getBoundingClientRect();
  transform = { x: 80, y: svgRect.height / 2 - 52, scale: 1 };
  render();
});

document.getElementById('search-box').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim();
  // Auto-expand to show matches
  if (searchTerm) expandToMatches(treeData, searchTerm);
  render();
});

function nodeMatchesOrDescendantMatches(node, term) {
  if (node.label.toLowerCase().includes(term.toLowerCase())) return true;
  if (node.children) {
    return node.children.some(c => nodeMatchesOrDescendantMatches(c, term));
  }
  return false;
}

function expandToMatches(node, term) {
  if (!node.children) return false;
  const anyChildMatches = node.children.some(c => nodeMatchesOrDescendantMatches(c, term));
  if (anyChildMatches) {
    node.expanded = true;
    for (const c of node.children) expandToMatches(c, term);
  }
  return anyChildMatches;
}

// ─── INITIAL RENDER ───────────────────────────────────────────────────────────

function init() {
  const svgRect = svg.getBoundingClientRect();
  transform.y = (svgRect.height) / 2 - 26;
  render();
}

// Wait for DOM to settle
requestAnimationFrame(() => requestAnimationFrame(init));

window.addEventListener('resize', () => render());
</script>
