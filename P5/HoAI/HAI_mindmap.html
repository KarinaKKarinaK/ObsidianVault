// ── YEAR → X ────────────────────────────────────────────────────────────────
function yearToX(y) {
  const seg = [
    [-400,1800,50,280],
    [1800,1900,280,480],
    [1900,1936,480,760],
    [1936,1945,760,1060],
    [1945,1952,1060,1360],
    [1952,1960,1360,1660],
    [1960,1970,1660,2060],
    [1970,1980,2060,2440],
    [1980,1990,2440,2820],
    [1990,2000,2820,3200],
    [2000,2015,3200,3700],
    [2015,2026,3700,4200],
  ];
  for (const [y0,y1,x0,x1] of seg) {
    if (y >= y0 && y <= y1) return x0 + (y-y0)/(y1-y0)*(x1-x0);
  }
  return 4200;
}

    obsidian:'P5/HoAI/HAI_topics',
    links:['lighthill','expert','winter2','alexnet'] },
  { id:'c-trust', x:830, label:'Technology & Trust', shortDesc:'Capability alone ≠ adoption',
    desc:'Hollerith: speed + legible output. UNIVAC on CBS: public trust demo. IBM brand: institutional risk reduction. Atanasoff: functional but passed over.',
    obsidian:'P5/HoAI/HAI_topics',
    links:['hollerith','univac'] },
  { id:'c-traditions', x:380, label:'Three Traditions', shortDesc:'Administration · Process Control · Science',
    desc:'Administration (Hollerith/census). Process control (Dutch waterworks, Taylor). Science (ballistics, astronomy). Three independent drivers of computing.',
    obsidian:'P5/HoAI/HAI_topics',
    links:['hollerith','arra'] },
];

// ── CROSS-CONNECTIONS ────────────────────────────────────────────────────────
const CONNECTIONS = [
  { from:'babbage',    to:'mark1',    color:'#c8a000', dash:'6,4', label:'Agendas', marker:'arrow-yellow' },
  { from:'turing36',   to:'dartmouth',color:'#5badd6', dash:'5,3', label:'foundation', marker:'arrow-blue' },
  { from:'church',     to:'lisp',     color:'#5badd6', dash:'5,3', label:'λ→LISP', marker:'arrow-blue' },
  { from:'cybernetics',to:'dartmouth',color:'#5badd6', dash:'6,4', label:'precursor', marker:'arrow-blue' },
  { from:'moore',      to:'edsac',    color:'#5a9e5a', dash:'4,3', label:'lectures', marker:'arrow-green' },
  { from:'moore',      to:'manchester',color:'#5a9e5a',dash:'4,3', label:'lectures', marker:'arrow-green' },
  { from:'perceptron', to:'backprop', color:'#5badd6', dash:'5,3', label:'neural\nlineage', marker:'arrow-blue' },
  { from:'backprop',   to:'alexnet',  color:'#5badd6', dash:'5,3', label:'deep\nlearning', marker:'arrow-blue' },
  { from:'lisp',       to:'expert',   color:'#5badd6', dash:'4,3', label:'AI lang', marker:'arrow-blue' },
  { from:'lighthill',  to:'expert',   color:'#c8a000', dash:'6,4', label:'winter\n→revival', marker:'arrow-yellow' },
  { from:'expert',     to:'winter2',  color:'#c8a000', dash:'6,4', label:'→2nd winter', marker:'arrow-yellow' },
  { from:'winter2',    to:'alexnet',  color:'#5badd6', dash:'6,4', label:'→AI summer', marker:'arrow-blue' },
  { from:'sage',       to:'arpanet',  color:'#c8a000', dash:'6,4', label:'military\n→tech', marker:'arrow-yellow' },
  { from:'arpanet',    to:'email',    color:'#c8a000', dash:'6,4', label:'Appropriation', marker:'arrow-yellow' },
  { from:'arpanet',    to:'www',      color:'#5a9e5a', dash:'5,3', label:'→web', marker:'arrow-green' },
  { from:'google',     to:'adwords',  color:'#c8a000', dash:'5,3', label:'Surv.Cap.', marker:'arrow-yellow' },
  { from:'adwords',    to:'gdpr',     color:'#c8a000', dash:'6,4', label:'→regulation', marker:'arrow-yellow' },
  { from:'fortran',    to:'algol',    color:'#c8a000', dash:'6,4', label:'Agendas', marker:'arrow-yellow' },
  { from:'arra',       to:'algol',    color:'#5a9e5a', dash:'5,3', label:'Dutch→', marker:'arrow-green' },
  { from:'eniac',      to:'edvac',    color:'#5a9e5a', dash:'4,3', label:'Moore\nSchool', marker:'arrow-green' },
  { from:'alexnet',    to:'llm',      color:'#5badd6', dash:'5,3', label:'→LLMs', marker:'arrow-blue' },
];

// ── COMPUTE POSITIONS ────────────────────────────────────────────────────────
const LANE_ABOVE = [TL_Y - 100, TL_Y - 200, TL_Y - 310];
const LANE_BELOW = [TL_Y + 100, TL_Y + 200, TL_Y + 300];

const eventMap = {};
for (const ev of EVENTS) {
  ev.x = yearToX(ev.year) - NW / 2;
  const lanes = ev.pos === 'above' ? LANE_ABOVE : LANE_BELOW;
  const laneIdx = Math.min((ev.lane || 1) - 1, lanes.length - 1);
  ev.cy = lanes[laneIdx]; // center y of node
  ev.h  = ev.label.includes('\n') ? 56 : 44;
  eventMap[ev.id] = ev;
}
for (const c of CONCEPTS) {
  c.cy = 34;
  c.h  = c.label.includes('\n') ? 52 : 42;
  c.x  = c.x - NW / 2;
}

// ── RENDERING ────────────────────────────────────────────────────────────────
const svg   = document.getElementById('timeline-svg');
const rootG = document.getElementById('root-g');

let transform = { x: 20, y: 0, scale: 0.9 };
let searchTerm  = '';
let showConn    = true;
const activeFilters = new Set(['computing','ai','concepts','figures']);

function colorFor(ev) {
  if (ev.highlight) return C.highlight;
  return C[ev.cat] || C.computing;
}

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function nodeVisible(ev) {
  const cat = ev.cat || 'concepts';
  return activeFilters.has(cat);
}

function wrapText(text, maxW, fsize) {
  const lines = text.split('\n');
  const out = [];
  for (const line of lines) {
    const words = line.split(' ');
    let cur = '';
    const cpl = Math.floor(maxW / (fsize * 0.56));
    for (const w of words) {
      if ((cur+' '+w).trim().length > cpl && cur) { out.push(cur); cur = w; }
      else cur = cur ? cur+' '+w : w;
    }
    if (cur) out.push(cur);
  }
  return out;
}

function renderNode(g, x, y, w, h, ev, isConceptNode) {
  const cs = isConceptNode ? C.concepts : colorFor(ev);
  const isMatch = searchTerm && (ev.label.toLowerCase().includes(searchTerm) || (ev.desc||'').toLowerCase().includes(searchTerm));

  // shadow
  g.appendChild(svgEl('rect', { x: x+2, y: y+3, width: w, height: h, rx: 7,
    fill: 'rgba(0,0,0,0.08)' }));
  // box
  const box = svgEl('rect', { x, y, width: w, height: h, rx: 7,
    fill: isMatch ? '#fffacd' : cs.fill,
    stroke: isMatch ? '#e0b800' : cs.border,
    'stroke-width': isMatch ? 2.5 : (ev.highlight ? 2 : 1.5),
    filter: 'url(#shadow)',
    cursor: ev.obsidian ? 'pointer' : 'default'
  });
  g.appendChild(box);

  // text
  const fontSize = isConceptNode ? 10.5 : 10;
  const lines = wrapText(ev.label, w - 14, fontSize);
  const lh = 14;
  const totalTH = lines.length * lh;
  let ty = y + h/2 - totalTH/2 + lh * 0.72;
  for (const line of lines) {
    const t = svgEl('text', { x: x + w/2, y: ty, 'text-anchor':'middle',
      fill: cs.text, 'font-size': fontSize, 'font-weight': isConceptNode ? '600' : '500',
      'font-family': isConceptNode ? "Georgia, serif" : 'system-ui, sans-serif',
      'pointer-events':'none' });
    t.textContent = line;
    g.appendChild(t);
    ty += lh;
  }

  // obsidian link indicator
  if (ev.obsidian) {
    const dot = svgEl('circle', { cx: x + w - 7, cy: y + 7, r: 3.5,
      fill: '#8fbc8f', opacity: '0.8', cursor: 'pointer' });
    g.appendChild(dot);
  }

  return box;
}

function render() {
  rootG.innerHTML = '';
  rootG.setAttribute('transform',
    `translate(${transform.x},${transform.y}) scale(${transform.scale})`);

  svg.setAttribute('width',  CANVAS_W);
  svg.setAttribute('height', CANVAS_H);

  // ── ERA BANDS ──────────────────────────────────────────────────────────────
  const eras = [
    { y0:-400, y1:1900, label:'Prehistory & Early Machines', x0: yearToX(-400), x1: yearToX(1900), bg:'rgba(240,230,210,0.18)' },
    { y0:1900, y1:1945, label:'Foundations (1900–1945)',     x0: yearToX(1900), x1: yearToX(1945), bg:'rgba(220,240,220,0.20)' },
    { y0:1945, y1:1965, label:'Cold War Computing',          x0: yearToX(1945), x1: yearToX(1965), bg:'rgba(210,235,250,0.20)' },
    { y0:1965, y1:1980, label:'Software Era & AI Winters',   x0: yearToX(1965), x1: yearToX(1980), bg:'rgba(255,250,225,0.25)' },
    { y0:1980, y1:2000, label:'PC Era & Internet',           x0: yearToX(1980), x1: yearToX(2000), bg:'rgba(235,220,240,0.20)' },
    { y0:2000, y1:2026, label:'AI Renaissance',              x0: yearToX(2000), x1: yearToX(2026), bg:'rgba(220,240,230,0.22)' },
  ];
  for (const era of eras) {
    rootG.appendChild(svgEl('rect', { x: era.x0, y: 0, width: era.x1-era.x0, height: CANVAS_H,
      fill: era.bg }));
    const t = svgEl('text', { x: (era.x0+era.x1)/2, y: CANVAS_H - 14,
      'text-anchor':'middle', fill:'#aaa', 'font-size':10,
      'font-family':'Georgia, serif', 'font-style':'italic' });
    t.textContent = era.label;
    rootG.appendChild(t);
  }

  // ── TIMELINE BAR ──────────────────────────────────────────────────────────
  rootG.appendChild(svgEl('line', {
    x1: 30, y1: TL_Y, x2: CANVAS_W - 30, y2: TL_Y,
    stroke: '#444', 'stroke-width': 2.5, opacity: 0.6
  }));

  // year ticks
  const tickYears = [-350,1822,1890,1936,1944,1945,1948,1950,1952,1956,1957,1960,
                     1964,1968,1971,1973,1980,1984,1989,1998,2000,2012,2017,2018];
  for (const yr of tickYears) {
    const tx = yearToX(yr);
    rootG.appendChild(svgEl('line', { x1:tx, y1:TL_Y-5, x2:tx, y2:TL_Y+5,
      stroke:'#666', 'stroke-width':1.2 }));
    const yrLabel = yr < 0 ? `${Math.abs(yr)} BCE` : yr.toString();
    const t = svgEl('text', { x:tx, y:TL_Y+16, 'text-anchor':'middle',
      fill:'#666', 'font-size': 8.5, 'font-family':'system-ui, sans-serif' });
    t.textContent = yrLabel;
    rootG.appendChild(t);
  }

  // ── CROSS-CONNECTIONS ──────────────────────────────────────────────────────
  if (showConn) {
    const connG = svgEl('g', {});
    for (const conn of CONNECTIONS) {
      const src = eventMap[conn.from];
      const dst = eventMap[conn.to];
      if (!src || !dst) continue;
      if (!nodeVisible(src) || !nodeVisible(dst)) continue;

      const sx = src.x + NW/2;
      const sy = src.cy;
      const ex = dst.x + NW/2;
      const ey = dst.cy;
      const my = (sy + ey) / 2;
      // curved path below/above timeline
      const below = sy > TL_Y || ey > TL_Y;
      const cy1 = below ? Math.max(sy, ey) + 40 : Math.min(sy, ey) - 50;
      const d = `M ${sx} ${sy} C ${sx} ${cy1}, ${ex} ${cy1}, ${ex} ${ey}`;

      const path = svgEl('path', { d, fill:'none',
        stroke: conn.color, 'stroke-width': 1.5, opacity: '0.55',
        'stroke-dasharray': conn.dash,
        'marker-end': `url(#${conn.marker})` });
      connG.appendChild(path);

      // connection label
      if (conn.label) {
        const mx2 = (sx+ex)/2;
        const by = below ? cy1 + 10 : cy1 - 4;
        const lt = svgEl('text', { x:mx2, y:by, 'text-anchor':'middle',
          fill: conn.color, 'font-size': 8, opacity: '0.8', 'font-style':'italic' });
        lt.textContent = conn.label.replace('\n',' ');
        connG.appendChild(lt);
      }
    }
    rootG.appendChild(connG);
  }

  // ── CONCEPT → EVENT LINK LINES (dotted) ───────────────────────────────────
  const clinkG = svgEl('g', {});
  for (const c of CONCEPTS) {
    for (const eid of (c.links || [])) {
      const ev = eventMap[eid];
      if (!ev || !nodeVisible(ev)) continue;
      const sx = c.x + NW/2;
      const sy = c.cy + c.h;
      const ex = ev.x + NW/2;
      const ey = ev.cy - ev.h/2;
      clinkG.appendChild(svgEl('line', {
        x1:sx, y1:sy, x2:ex, y2:ey,
        stroke:'#c8a000', 'stroke-width':1, 'stroke-dasharray':'3,4', opacity:'0.35'
      }));
    }
  }
  rootG.appendChild(clinkG);

  // ── STEM LINES (event to timeline) ────────────────────────────────────────
  const stemG = svgEl('g', {});
  for (const ev of EVENTS) {
    if (!nodeVisible(ev)) continue;
    const cx = ev.x + NW/2;
    const nodeEdgeY = ev.pos === 'above' ? ev.cy + ev.h/2 : ev.cy - ev.h/2;
    const cs = colorFor(ev);
    stemG.appendChild(svgEl('line', {
      x1: cx, y1: nodeEdgeY, x2: cx, y2: TL_Y,
      stroke: cs.border, 'stroke-width': 1.2, opacity: '0.5'
    }));
    // dot on timeline
    stemG.appendChild(svgEl('circle', {
      cx, cy: TL_Y, r: 4,
      fill: cs.border, opacity: '0.7'
    }));
  }
  rootG.appendChild(stemG);

  // ── EVENT NODES ───────────────────────────────────────────────────────────
  const nodeG = svgEl('g', {});
  for (const ev of EVENTS) {
    if (!nodeVisible(ev)) continue;
    const ny = ev.cy - ev.h / 2;
    const g = svgEl('g', { class:'evt-node' });
    const box = renderNode(g, ev.x, ny, NW, ev.h, ev, false);

    box.addEventListener('click', () => {
      if (ev.obsidian) window.open('obsidian://open?vault=ObsidianVault&file=' + encodeURIComponent(ev.obsidian), '_self');
    });
    g.addEventListener('mouseenter', e => showTip(e, ev));
    g.addEventListener('mousemove', moveTip);
    g.addEventListener('mouseleave', hideTip);
    nodeG.appendChild(g);
  }
  rootG.appendChild(nodeG);

  // ── CONCEPT NODES (sticky top row) ────────────────────────────────────────
  const cg = svgEl('g', {});
  for (const c of CONCEPTS) {
    const ny = c.cy;
    const g = svgEl('g', { class:'concept-node' });
    renderNode(g, c.x, ny, NW, c.h, c, true);
    g.addEventListener('click', () => {
      if (c.obsidian) window.open('obsidian://open?vault=ObsidianVault&file=' + encodeURIComponent(c.obsidian), '_self');
    });
    g.addEventListener('mouseenter', e => showTip(e, c));
    g.addEventListener('mousemove', moveTip);
    g.addEventListener('mouseleave', hideTip);
    cg.appendChild(g);
  }
  rootG.appendChild(cg);
}

// ── TOOLTIP ──────────────────────────────────────────────────────────────────
const tip = document.getElementById('tooltip');

function showTip(e, node) {
  const linkHint = node.obsidian ? `<div class="t-link">Click to open in Obsidian →</div>` : '';
  tip.innerHTML = `<strong>${node.label.replace(/\n/g,' ')}</strong>${node.desc || node.shortDesc || ''}${linkHint}`;
  tip.style.display = 'block';
  moveTip(e);
}
function moveTip(e) {
  let x = e.clientX + 15, y = e.clientY + 15;
  if (x + 310 > window.innerWidth) x = e.clientX - 315;
  if (y + 120 > window.innerHeight) y = e.clientY - 90;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { tip.style.display = 'none'; }

// ── PAN + ZOOM ────────────────────────────────────────────────────────────────
const wrap = document.getElementById('canvas-wrap');
let panning = false, panStart = {}, txStart = {};

wrap.addEventListener('mousedown', e => {
  if (e.target.closest('.evt-node,.concept-node')) return;
  panning = true;
  panStart = { x: e.clientX, y: e.clientY };
  txStart  = { x: transform.x, y: transform.y };
  wrap.classList.add('grabbing');
});
window.addEventListener('mousemove', e => {
  if (!panning) return;
  transform.x = txStart.x + (e.clientX - panStart.x);
  transform.y = txStart.y + (e.clientY - panStart.y);
  rootG.setAttribute('transform', `translate(${transform.x},${transform.y}) scale(${transform.scale})`);
});
window.addEventListener('mouseup', () => { panning = false; wrap.classList.remove('grabbing'); });

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const ns = Math.min(3, Math.max(0.18, transform.scale * delta));
  const r = wrap.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  transform.x = mx - (mx - transform.x) * ns / transform.scale;
  transform.y = my - (my - transform.y) * ns / transform.scale;
  transform.scale = ns;
  rootG.setAttribute('transform', `translate(${transform.x},${transform.y}) scale(${transform.scale})`);
}, { passive: false });

// ── CONTROLS ─────────────────────────────────────────────────────────────────
document.getElementById('btn-reset').addEventListener('click', () => {
  transform = { x: 20, y: 0, scale: 0.9 };
  render();
});

document.getElementById('btn-connections').addEventListener('click', function() {
  showConn = !showConn;
  this.textContent = showConn ? 'Connections ✓' : 'Connections ✗';
  render();
});

document.getElementById('search-box').addEventListener('input', e => {
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    const cat = this.dataset.cat;
    if (activeFilters.has(cat)) activeFilters.delete(cat);
    else activeFilters.add(cat);
    this.classList.toggle('active');
    render();
  });
});

// ── INIT ─────────────────────────────────────────────────────────────────────
requestAnimationFrame(() => requestAnimationFrame(() => {
  const h = wrap.getBoundingClientRect().height;
  transform.y = h / 2 - TL_Y * transform.scale;
  render();
}));
window.addEventListener('resize', render);
</script>
